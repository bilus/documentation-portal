openapi: 3.0.3
info:
  title: Petstore
  version: 1.0.0
  description: Pets of the portal's tests, written for OpenAPI 3.0.
paths:
  /pets:
    get:
      operationId: listPets
      summary: List pets
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            format: int32
      responses:
        "200":
          description: A page of pets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pets"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createPet
      summary: Create a pet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPet"
      responses:
        "201":
          description: The created pet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        default:
          $ref: "#/components/responses/Error"
  /pets/{petId}:
    get:
      operationId: showPetById
      summary: Show a pet
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The pet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        default:
          $ref: "#/components/responses/Error"
components:
  responses:
    Error:
      description: Unexpected error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    NewPet:
      type: object
      required: [name]
      properties:
        name:
          type: string
        microchipId:
          type: string
    Pet:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        microchipId:
          type: string
    Pets:
      type: array
      items:
        $ref: "#/components/schemas/Pet"
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
        message:
          type: string
