* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }

main { display: grid; grid-template-columns: minmax(0, 1fr) 7px var(--code-width, 40%); height: calc(100% - 58px); }
#left { overflow: auto; padding: 12px 16px 32px; }

#drawing a[href] { cursor: pointer; }
#drawing a[href]:hover tspan, #drawing a[href]:focus tspan { fill: #4a37b0; }

.line.del { background: var(--del-bg); }
.line.hunk { color: var(--muted); }

.line.added .n { box-shadow: inset -4px 0 0 var(--add); }
.line.modified .n { box-shadow: inset -4px 0 0 var(--amber); }
#code-body a.ident { color: inherit; text-decoration: none; }
#code-body a.ident:hover, #code-body a.ident:focus { text-decoration: underline; cursor: pointer; }
/* A marked identifier: its highlight, and its mark drawn above the line, so no column moves. */
a.ident.mark-changed, a.ident.mark-reached { position: relative; border-radius: 2px; }
a.ident.mark-changed { background: var(--del-bg); }
a.ident.mark-reached { background: var(--amber-bg); }
a.ident.mark-changed::after, a.ident.mark-reached::after { position: absolute; top: -0.55em; right: -0.5em; font-weight: 700; }
a.ident.mark-changed::after { content: "*"; color: var(--del); }
a.ident.mark-reached::after { content: "~"; color: var(--amber); }
#uncovered ul { margin: 0; padding-left: 18px; font: 12.5px/1.9 ui-monospace, SFMono-Regular, Menlo, monospace; }
#uncovered a.ident { color: var(--ink); text-decoration: none; }

#uncovered li .muted { margin-left: 1.2em; }

.hljs-comment { color: var(--code-cmt); }
.hljs-type, .hljs-built_in { color: var(--code-type); }
.hljs-number { color: var(--code-num); }

re":"// Command docportal serves the documentation of an API spec from a local\n// directory.\npackage main\n\nimport (\n\t\"errors\"\n\t\"flag\"\n\t\"fmt\"\n\t\"log\"\n\t\"net/http\"\n\t\"os\"\n\t\"strings\"\n\n\t\"github.com/bilus/documentation-portal/portal\"\n)\n\ntype config struct {\n\tAddr     string\n\tSpecsDir string\n\tSpecPath string // relative to SpecsDir\n}\n\nfunc main() {\n\taddr, h, err := startup(os.Args[1:], os.Getenv)\n\tif err != nil {\n\t\tfmt.Fprintln(os.Stderr, \"docportal:\", err)\n\t\tos.Exit(1)\n\t}\n\tlog.Printf(\"listening on %s\", addr)\n\tlog.Fatal(http.ListenAndServe(addr, h))\n}\n\n// startup reads the configuration, opens the specs directory and builds the\n// portal. It returns the address to listen on and the portal.\nfunc startup(args []string, getenv func(string) string) (string, http.Handler, error) {\n\tcfg, err := parseConfig(args, getenv)\n\tif err != nil {\n\t\treturn \"\", nil, err\n\t}\n\tpcfg, err := openSpecs(cfg.SpecsDir, cfg.SpecPath)\n\tif err != nil {\n\t\treturn \"\", nil, err\n\t}\n\th, err := portal.New(pcfg)\n\tif err != nil {\n\t\treturn \"\", nil, err\n\t}\n\treturn cfg.Addr, h, nil\n}\n\n// parseConfig reads the configuration from the flags and the environment.\n// Flags win over the environment, which wins over the defaults.\nfunc parseConfig(args []string, getenv func(string) string) (config, error) {\n\tcfg := config{Addr: \":8080\", SpecsDir: \".\", SpecPath: \"openapi.yaml\"}\n\tif v := getenv(\"DOCPORTAL_ADDR\"); v != \"\" {\n\t\tcfg.Addr = v\n\t}\n\tif v := getenv(\"DOCPORTAL_SPECS_DIR\"); v != \"\" {\n\t\tcfg.SpecsDir = v\n\t}\n\tif v := getenv(\"DOCPORTAL_SPEC_PATH\"); v != \"\" {\n\t\tcfg.SpecPath = v\n\t}\n\n\t// The flag package's message and usage go into the error, which main prints.\n\tvar out strings.Builder\n\tfs := flag.NewFlagSet(\"docportal\", flag.ContinueOnError)\n\tfs.SetOutput(\u0026out)\n\tfs.StringVar(\u0026cfg.Addr, \"addr\", cfg.Addr, \"address to listen on\")\n\tfs.StringVar(\u002 pment`, which tracks `origin/master`. Base: `a34263b`.\n\n## Requirements\n\nRestated from the issue's acceptance criteria.\n\n1. The operator names the content directory with `-docs-dir` or `DOCPORTAL_DOCS_DIR`. Without either, docportal serves the API spec as before, and no page links to the document list.\n2. Startup stops with an error naming the content directory when the directory cannot be opened.\n3. `GET /docs/` returns the document list: a link to the document page of every markdown file in the content directory, subdirectories included, sorted by path.\n4. `GET /docs/{path}` returns the document page of the markdown file at that path, rendered as GitHub Flavored Markdown with at least headings, paragraphs, lists, links, emphasis and code blocks. The URL opens the same file on a direct load and on a reload.\n5. On a document page, a relative link to another markdown file opens that file's document page, and an image with a relative URL shows through `/raw/{path}`.\n6. The portal reads the content directory on every request, so a reload shows an edited, added or removed file without a restart.\n7. Active content in a markdown file has no effect in the reader's browser: neither a `\u003cscript\u003e` element nor a `javascript:` link runs.\n8. `GET /raw/{path}` returns the image at that path, a PNG, JPEG, GIF, WebP or SVG file, with the image type of its extension, `X-Content-Type-Options: nosniff` and `Content-Security-Policy: sandbox`. Any other file gets a 404, so the route never serves `text/html`. A browser test shows that the `\u003cscript\u003e` of an SVG does not run when a reader opens the SVG's raw URL.\n9. A request for a missing file, for a file that is not a markdown file on `/docs/`, or for a path outside the content directory gets a 404 and no content of another file. A path outside means one with `..`, an absolute path, or a symlink out of the directory.\n10. Every HTML page of the portal, the error pages included, shows the navigation bar: a link to the viewer page, and a link to the document list when a content directory is configured.\n11. The tests read the sample documents: nested markdown files, a relative link, an image and a markdown file with a `\u003cscript\u003e` element. The symlink out of the directory comes from the tests at run time.\n12. The document list and every document page show the document sidebar: the markdown files that are not hidden, grouped by directory, drawn with the markup and the CSS classes of the Elements sidebar, so that its computed style matches the sidebar of the viewer page. It marks the open document the way Elements marks the open operation.\n\nOut of scope: markdown from a source repository (#11), branches (#6), release notes (#12), a relative link to an API spec opening the viewer page, files other than images on `/raw/`, front matter, Mermaid, admonitions, raw HTML in markdown, and search.\n\n## Questions and assumptions\n\n- Q1. Names: the flag `-docs-dir` and the variable `DOCPORTAL_DOCS_DIR`, as the issue suggests, before #4 picks the names of its variables. Assumption: those names.\n- Q2. Which files the list shows, an open question of #11. Assumption: every file named `*.md` or `*.markdown`, without hidden files and without the contents of hidden directories, whose names start with a dot. The list titles and sorts the files by path. A hidden markdown file also gets a 404 on `/docs/`.\n- Q3. Markdown flavour. Assumption: CommonMark with goldmark's GFM extension (tables, strikethrough, autolinks, task lists) and automatic heading IDs, without front matter, Mermaid or admonitions.\n- Q4. Raw HTML in markdown. Assumption: goldmark leaves it out, its default, and bluemonday's UGC policy sanitizes the rendered HTML as a second check.\n- Q5. Link rewriting. A document page's URL mirrors its file's path, so a browser resolves a relative link between markdown files to the right document page with no rewriting. Assumption: rewrite image references to `/raw/` only, and leave link rewriting to #11, which adds `?branch=`.\n- Q6. Navigation. A bar at the top of each page with two links. On the document list and the document pages, the document sidebar sits at the left, as the Elements sidebar does on the viewer page. Decided by the user, after the check of Elements 9.0.25 found no attribute or OpenAPI extension that adds entries to the Elements sidebar.\n- Q7. Design. Request handling stays inside box 3.3, as decided for #2: the top diagram shows startup, and the handlers with their helpers belong to the box of `portal.newRouter`. Most of this feature runs per request, so a diagram of the request flow may help the reviewer. Assumption: as decided for #2.\n- Q8. Metaphor. The user dropped the metaphor during #2. Assumption: this plan has none.\n- Q10. Sidebar markup. The document sidebar copies the markup and the `sl-` classes of the Elements 9.0.25 sidebar, which are internal to Elements, so an upgrade of Elements can change them. `TestDocSidebarMatchesElements` compares the computed styles of both sidebars, so an upgrade that breaks the match fails the test. Assumption: the document sidebar's title is \"Documents\", and it leaves out Elements' \"powered by Stoplight\" link.\n- Q9. Delivery. Each stage lands as one commit on `bilus/development` after its approval, and `devbox run -- gps rr` opens its pull request. Commit messages stay under 15 words, which overrides the skill's two-sentence body. Handoffs go into the chat. Until stage 4 lands, master carries the open holes: `-docs-dir` works there but serves the mock pages.\n\n## The change in brief\n\nThe operator can now name a content directory with `-docs-dir` or `DOCPORTAL_DOCS_DIR`. Startup opens it with `os.OpenRoot` after the specs directory, adds its handle to the portal configuration, and stops with an error naming the directory on a failure. With a content directory, the router sends `/docs/` to the document list, `/docs/{path}` to the document page of a markdown file and `/raw/{path}` to the raw file of an image. Without one, those paths get a 404, and no page links to them. The portal reads the content directory on every request, renders markdown as HTML without active content, and shows the error page for a path that names no markdown file, a hidden file or a file outside the content directory. Every HTML page shows the navigation bar.\n\n## Stages\n\nFrom stage 1 on, the document pages pass `s.nav()` and `s.sidebar(path)` to their template, and both return nothing until stages 3 and 4 fill them.\n\nEach stage ends with `devbox run make build lint test test-e2e`, the hole census (`grep -rn \"HOLE(\" --include=*.go .`), the score card, the review page and a halt for review.\n\n### Stage 1: the content directory and the document list\n\n- Goal: docportal opens the content directory at startup, refusing one it cannot open, and `/docs/` lists its markdown files.\n- Requirement: 1, 2, 3.\n- Dependencies: none.\n- Holes: `1 main.openDocs`, `1 portal.site.docList`.\n- Acceptance: `TestStartupRejectsMissingDocsDir`, `TestOpenDocsKeepsReadsInside`, `TestDocList`.\n- Size: 130 lines.\n\n### Stage 2: the document page\n\n- Goal: `/docs/{path}` shows a markdown file as HTML without active content, with its images under `/raw/`, and every other path under `/docs/` gets a 404.\n- Requirement: 4, 5, 6, 7, 9.\n- Dependencies: 1.\n- Holes: `2 portal.site.docPage`, and the helpers its fill declares.\n- Acceptance: `TestDocPage`, `TestDocPageDropsActiveContent`, `TestDocPageReadsEachRequest`, `TestDocsNotFound`, `TestStartupKeepsDocsInside`.\n- Size: 220 lines.\n\n### Stage 3: raw files and the navigation\n\n- Goal: `/raw/{path}` serves the images of the content directory with headers that stop the browser from running them, every page shows the navigation bar, and README.md describes `-docs-dir` and the new routes.\n- Requirement: 8, 10.\n- Dependencies: 2.\n- Holes: `3 portal.site.rawFile`, `3 portal.site.nav`.\n- Acceptance: `TestRawFile`, `TestRawSVGRunsNoScript`, `TestPagesShareNavigation`.\n- Size: 190 lines.\n\n### Stage 4: the document sidebar\n\n- Goal: the document list and the document pages show the document sidebar, in the style of the sidebar of the viewer page.\n- Requirement: 12.\n- Dependencies: 2.\n- Holes: `4 portal.site.sidebar`.\n- Acceptance: `TestDocSidebar`, `TestDocSidebarMatchesElements`.\n- Size: 150 lines.\n","diff":"--- /dev/null\n+++ b/docs/plans/2026-09-29-local-markdown.md\n@@ -0,0 +1,84 @@\n+# View markdown files from a local directory\n+\n+Issue: bilus/documentation-portal#13 (requirement R10, milestone MVP).\n+Ledger: `docs/plans/2026-09-29-local-markdown.ledger.md`.\n+Design: `docs/flow.dfd` and `docs/flow.3.dfd`, terms in `docs/vocabulary.md`, review page in `docs/review/index.html`.\n+Branch: `bilus/development`, which tracks `origin/master`. Base: `a34263b`.\n+\n+## Requirements\n+\n+Restated from the issue's acceptance criteria.\n+\n+1. The operator names the content directory with `-docs-dir` or `DOCPORTAL_DOCS_DIR`. Without either, docportal serves the API spec as before, and no page links to the document list.\n+2. Startup stops with an error naming the content directory when the directory cannot be opened.\n+3. `GET /docs/` returns the document list: a link to the document page of every markdown file in the content directory, subdirectories included, sorted by path.\n+4. `GET /docs/{path}` returns the document page of the markdown file at that path, rendered as GitHub Flavored Markdown with at least headings, paragraphs, lists, links, emphasis and code blocks. The URL opens the same file on a direct load and on a reload.\n+5. On a document page, a relative link to another markdown file opens that file's document page, and an image with a relative URL shows through `/raw/{path}`.\n+6. The portal reads the content directory on every request, so a reload shows an edited, added or removed file without a restart.\n+7. Active content in a markdown file has no effect in the reader's browser: neither a `\u003cscript\u003e` element nor a `javascript:` link runs.\n+8. `GET /raw/{path}` returns the image at that path, a PNG, JPEG, GIF, WebP or SVG file, with the image type of its extension, `X-Content-Type-Options: nosniff` and `Content-Security-Policy: sandbox`. Any other file gets a 404, so the route never serves `text/html`. A browser test shows that the `\u003cscript\u003e` of an SVG does not run when a reader opens the SVG's raw URL.\n+9. A request for a missing file, for a file that is not a markdown file on `/docs/`, or for a path outside the content directory gets a 404 and no content of another file. A path outside means one with `..`, an absolute path, or a symlink out of the directory.\n+10. Every HTML page of the portal, the error pages included, shows the navigation bar: a link to the viewer page, and a link to the document list when a content directory is configured.\n+11. The tests read the sample documents: nested markdown files, a relative link, an image and a markdown file with a `\u003cscript\u003e` element. The symlink out of the directory comes from the tests at run time.\n+12. The document list and every document page show the document sidebar: the markdown files that are not hidden, grouped by directory, drawn with the markup and the CSS classes of the Elements sidebar, so that its computed style matches the sidebar of the viewer page. It marks the open document the way Elements marks the open operation.\n+\n+Out of scope: markdown from a source repository (#11), branches (#6), release notes (#12), a relative link to an API spec opening the viewer page, files other than images on `/raw/`, front matter, Mermaid, admonitions, raw HTML in markdown, and search.\n+\n+## Questions and assumptions\n+\n+- Q1. Names: the flag `-docs-dir` and the variable `DOCPORTAL_DOCS_DIR`, as the issue suggests, before #4 picks the names of its variables. Assumption: those names.\n+- Q2. Which files the list shows, an open question of \"Documents\", and it leaves out Elements' \"powered by Stoplight\" link.\n+- Q9. Delivery. Each stage lands as one commit on `bilus/development` after its approval, and `devbox run -- gps rr` opens its pull request. Commit messages stay under 15 words, which overrides the skill's two-sentence body. Handoffs go into the chat. Until stage 4 lands, master carries the open holes: `-docs-dir` works there but serves the mock pages.\n+\n+## The change in brief\n+\n+The operator can now name a content directory with `-docs-dir` or `DOCPORTAL_DOCS_DIR`. Startup opens it with `os.OpenRoot` after the specs directory, adds its handle to the portal configuration, and stops with an error naming the directory on a failure. With a content directory, the router sends `/docs/` to the document list, `/docs/{path}` to the document page of a markdown file and `/raw/{path}` to the raw file of an image. Without one, those paths get a 404, and no page links to them. The portal reads the content directory on every request, renders markdown as HTML without active content, and shows the error page for a path that names no markdown file, a hidden file or a file outside the content directory. Every HTML page shows the navigation bar.\n+\n+## Stages\n+\n+From stage 1 on, the document pages pass `s.nav()` and `s.sidebar(path)` to their template, and both return nothing until stages 3 and 4 fill them.\n+\n+Each stage ends with `devbox run make build lint test test-e2e`, the hole census (`grep -rn \"HOLE(\" --include=*.go .`), the score card, the review page and a halt for review.\n+\n+### Stage 1: the content directory and the document list\n+\n+- Goal: docportal opens the content directory at startup, refusing one it cannot open, and `/docs/` lists its markdown files.\n+- Requirement: 1, 2, 3.\n+- Dependencies: none.\n+- Holes: `1 main.openDocs`, `1 portal.site.docList`.\n+- Acceptance: `TestStartupRejectsMissingDocsDir`, `TestOpenDocsKeepsReadsInside`, `TestDocList`.\n+- Size: 130 lines.\n+\n+### Stage 2: the document page\n+\n+- Goal: `/docs/{path}` shows a markdown file as HTML without active content, with its images under `/raw/`, and every other path under `/docs/` gets a 404.\n+- Requirement: 4, 5, 6, 7, 9.\n+- Dependencies: 1.\n+- Holes: `2 portal.site.docPage`, and the helpers its fill declares.\n+- Acceptance: `TestDocPage`, `TestDocPageDropsActiveContent`, `TestDocPageReadsEachRequest`, `TestDocsNotFound`, `TestStartupKeepsDocsInside`.\n+- Size: 220 lines.\n+\n+### Stage 3: raw files and the navigation\n+\n+- Goal: `/raw/{path}` serves the images of the content directory with headers that stop the browser from running them, every page shows the navigation bar, and README.md describes `-docs-dir` and the new routes.\n+- Requirement: 8, 10.\n+- Dependencies: 2.\n+- Holes: `3 portal.site.rawFile`, `3 portal.site.nav`.\n+- Acceptance: `TestRawFile`, `TestRawSVGRunsNoScript`, `TestPagesShareNavigation`.\n+- Size: 190 lines.\n+\n+### Stage 4: the document sidebar\n+\n+- Goal: the document list and the document pages show the document sidebar, in the style of the sidebar of the viewer page.\n+- Requirement: 12.\n+- Dependencies: 2.\n+- Holes: `4 portal.site.sidebar`.\n+- Acceptance: `TestDocSidebar`, `TestDocSidebarMatchesElements`.\n+- Size: 150 lines.\n","beforeLinks":null,"afterLinks":null},"docs/review/report.txt":{"before":"design flow.dfd: 2 diagrams, 6 boxes\n\nprivate items\n  none\n\npressure\n  flow.dfd    max 0 in 2 gaps, first between 1 and 2\n  flow.3.dfd  max 0 in 2 gaps, first between 3.1 and 3.2\n\nfindings\n  none\n\ndesign packages\n  flow.dfd, depth 0    main, portal\n  flow.3.dfd, depth 1  portal\n\ntotals\n  shared items by level                               none\n  private items                                       0\n  unlabeled arrow                                     0\n  dead item                                           0\n  orphan item                                         0\n  read before write },"docs/vocabulary.md":{"before":"# Vocabulary\n\nTerms of docportal, one per line.\n\n- docportal: the program built from cmd/docportal.\n- API spec: an OpenAPI 3.0 or 3.1 document in YAML with a non-empty info.title, usually a bundle.\n- bundle: an API spec whose $refs all point inside its own file, such as #/components/schemas/Pet.\n- sample bundle: testdata/specs/petstore-3.0.yaml or testdata/specs/petstore-3.1.yaml, the bundles the tests render.\n- operation: one method on one path of an API spec, such as GET /pets/{petId}.\n- model: a schema under components/schemas, as Stoplight Elements lists and opens it.\n- operator: the person who starts docportal and gives it its configuration.\n- reader: the person who reads the documentation in a browser.\n- arguments: docportal's command-line arguments, without the program name: the flags and nothing else.\n- flags: -addr, -specs-dir and -spec-path. Any other flag is rejected.\n- environment: a lookup of environment variables, of which docportal reads DOCPORTAL_ADDR, DOCPORTAL_SPECS_DIR and DOCPORTAL_SPEC_PATH. Tests pass their own lookup.\n- configuration: the address, the directory name and the spec path, each taken from its flag, else from the environment, else from its default: :8080, . and openapi.yaml.\n- startup: reading the configuration, opening the specs directory and building the portal, in main.startup. A failure there stops docportal before it listens.\n- address: the network address docportal listens on, such as :8080.\n- specs directory: the local directory that holds the API specs.\n- directory name: the specs directory's path on the local file system, as the operator gives it.\n- directory handle: the opened specs directory, an fs.FS. Every read of a spec goes through it, so no read leaves the directory.\n- spec path: the path, relative to the specs directory, of the API spec to serve.\n- configured spec: the file at the spec path. The portal serves no other file of the specs directory.\n- missing spec: a spec path with no file behind it. It gets a 404 that names the file.\n- invalid spec: a configured spec that is not an API spec: not YAML, not OpenAPI 3.0 or 3.1, or without a title. It gets an error page naming the file and the reason, and /api/specs/{spec path} answers with an error naming the file, both with status 422.\n- error page: the HTML page the portal shows instead of the viewer page for an invalid or missing spec.\n- portal configuration: the directory handle and the spec path, as portal.New takes them. Tests pass any fs.FS in the handle's place.\n- portal: the HTTP handler that redirects / to the viewer page and serves the viewer page, the raw spec and the Elements assets.\n- HTTP server: net/http's server, which listens on the address and calls the portal for each request.\n- viewer page: the HTML page at /specs/{spec path} that embeds Stoplight Elements pointed at the raw spec.\n- raw spec: the response at /api/specs/{spec path}: the configured spec's content, unchanged, as application/yaml.\n- Stoplight Elements: the web component that renders an API spec as documentation in the reader's browser.\n- Elements assets: the Stoplight Elements script, stylesheet and license, downloaded by `make setup` and embedded in docportal.\n","after":"# Vocabulary\n\nTerms of docportal, one per line.\n\n- docportal: the program built from cmd/docportal.\n- API spec: an OpenAPI 3.0 or 3.1 document in YAML with a non-empty info.title, usually a bundle.\n- bundle: an API spec whose $refs all point inside its own file, such as #/components/schemas/Pet.\n- sample bundle: testdata/specs/petstore-3.0.yaml or testdata/specs/petstore-3.1.yaml, the bundles the tests render.\n- operation: one method on one path of an API spec, such as GET /pets/{petId}.\n- model: a schema under components/schemas, as Stoplight Elements lists and opens it.\n- operator: the person who starts docportal and gives it its configuration.\n- reader: the person who reads the documentation in a browser.\n- arguments: docportal's command-line arguments, without the program name: the flags and nothing else.\n- flags: -addr, -specs-dir, -spec-path and -docs-dir. Any other flag is rejected.\n- environment: a lookup of environment variables, of which docportal reads DOCPORTAL_ADDR, DOCPORTAL_SPECS_DIR, DOCPORTAL_SPEC_PATH and DOCPORTAL_DOCS_DIR. Tests pass their own lookup.\n- configuration: the address, the specs directory name, the spec path and the content directory name, each taken from its flag, else from the environment, else from its default: :8080, ., openapi.yaml and empty.\n- startup: reading the configuration, opening the specs directory and the named content directory, if any, and building the portal, in main.startup. A failure there stops docportal before it listens.\n- address: the network address docportal listens on, such as :8080.\n- specs directory: the local directory that holds the API specs.\n- specs directory name: the specs directory's path on the local file system, as the operator gives it.\n- specs directory handle: the specs directory opened with os.OpenRoot, as an fs.FS. Every read of a spec goes through it, and os.OpenRoot keeps each read inside the directory, symlinks included.\n- spec path: the path, relative to the specs directory, of the API spec to serve.\n- configured spec: the file at the spec path. Under /specs/ and /api/specs/, the portal serves no other file of the specs directory.\n- missing spec: a request under /specs/ or /api/specs/ that names no configured spec: a path other than the spec path, or a spec path with no file behind it. It gets a 404 that names the path.\n- invalid spec: a configured spec that is not an API spec: not YAML, not OpenAPI 3.0 or 3.1, or without a title. It gets an error page naming the file and the reason, and /api/specs/{spec path} answers with an error naming the file and the reason, both with status 422.\n- error page: the HTML page the portal shows instead of the viewer page for an invalid or tf-8\")\n\tw.Write([]byte(`\u003ch1 id=\"introduction\"\u003eIntroduction\u003c/h1\u003e`))\n}\n\n// rawFile writes the image file at the request's path with the image type\n// of its extension and headers that stop the browser from running it, or a\n// 404 for any other file or without a content directory.\nfunc (s *site) rawFile(w http.ResponseWriter, r *http.Request) {\n\t// HOLE(3): serve the image with nosniff and a sandbox CSP; else, or without s.docs, 404\n}\n\n// sidebarGroup is one group of the document sidebar: the markdown files of\n// one directory, under the directory's path.\ntype sidebarGroup struct {\n\tTitle string // empty for the top of the content directory\n\tLinks []sidebarLink\n}\n\n// sidebarLink links the document page of one markdown file.\ntype sidebarLink struct {\n\tTitle   string\n\tURL     string\n\tCurrent bool\n}\n\n// sidebar returns the document sidebar: the markdown files that are not\n// hidden, grouped by directory, with the file at current marked.\nfunc (s *site) sidebar(current string) []sidebarGroup {\n\t// HOLE(4): group the markdown files by directory, marking current; nil without s.docs\n\treturn nil\n}\n","diff":"--- /dev/null\n+++ b/portal/docs.go\n@@ -0,0 +1,49 @@\n+package portal\n+\n+import \"net/http\"\n+\n+// docList writes the document list: a link to the document page of every\n+// markdown file in the content directory, sorted by path, or a 404 without a\n+// content directory.\n+func (s *site) docList(w http.ResponseWriter, r *http.Request) {\n+\t// HOLE(1): list the markdown files that are not hidden, by path; 404 without s.docs\n+\tw.Header().Set(\"Content-Type\", \"text/html; charset=utf-8\")\n+\tw.Write([]byte(`\u003ca href=\"/docs/guide/intro.md\"\u003eguide/intro.md\u003c/a\u003e`))\n+}\n+\n+// docPage writes the document page of the markdown file at the request's\n+// path, or a 404 error page naming the path, also without a content\n+// directory.\n+func (s *site) docPage(w http.ResponseWriter, r *http.R al(t *testing.T, docs fs.FS) http.Handler {\n\tt.Helper()\n\th, err := portal.New(portal.Config{Specs: fstest.MapFS{\"apis/pets.yaml\": {Data: []byte(pets)}}, SpecPath: \"apis/pets.yaml\", Docs: docs})\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\treturn h\n}\n\nfunc TestNoDocsWithoutContentDir(t *testing.T) {\n\th := newPortal(t, fstest.MapFS{\"apis/pets.yaml\": {Data: []byte(pets)}}, \"apis/pets.yaml\")\n\tfor _, path := range []string{\"/docs/\", \"/docs/README.md\", \"/raw/guide/diagram.png\"} {\n\t\tif rec := get(h, path); rec.Code != http.StatusNotFound {\n\t\t\tt.Errorf(\"%s: %d\", path, rec.Code)\n\t\t}\n\t}\n}\n\nfunc TestDocList(t *testing.T) {\n\tt.Skip(\"HOLE(1): list the markdown files of the content directory\")\n\trec := get(newDocsPortal(t, sampleDocs), \"/docs/\")\n\tif rec.Code != http.StatusOK || !strings.HasPrefix(rec.Header().Get(\"Content-Type\"), \"text/html\") {\n\t\tt.Fatalf(\"got %d %s\", rec.Code, rec.Header().Get(\"Content-Type\"))\n\t}\n\tbody := rec.Body.String()\n\tvar at []int\n\tfor _, doc := range []string{\"README.md\", \"guide/intro.md\", \"unsafe.md\"} {\n\t\ti := strings.Index(body, `href=\"/docs/`+doc+`\"`)\n\t\tif i \u003c 0 {\n\t\t\tt.Errorf(\"the list does not link %s\", doc)\n\t\t}\n\t\tat = append(at, i)\n\t}\n\tif !sort.IntsAreSorted(at) {\n\t\tt.Errorf(\"the list is not sorted by path: links at %v\", at)\n\t}\n\tfor _, name := range []string{\".hidden.md\", \"draft.md\", \"notes.txt\", \"page.html\", \"evil.svg\", \"diagram.png\"} {\n\t\tif strings.Contains(body, name) {\n\t\t\tt.Errorf(\"the list shows %s\", name)\n\t\t}\n\t}\n}\n\nfunc TestDocPage(t *testing.T) {\n\tt.Skip(\"HOLE(2): render a markdown file as its document page\")\n\trec := get(newDocsPortal(t, sampleDocs), \"/docs/guide/intro.md\")\n\tif rec.Code != http.StatusOK || !strings.HasPrefix(rec.Header().Get(\"Content-Type\"), \"text/html\") {\n\t\tt.Fatalf(\"got %d %s\", rec.Code, rec.Header().Get(\"Content-Type\"))\n\t}\n\tfor _, want := range []string{\n\t\t\"\u003ch1\",\n\t\t\"Introduction\u003c/h1\u003e\",\n\t\t\"\u003cem\u003emarkdown\u003c/em\u003e\",\n\t\t\"\u003cli\u003eone\u003c/li\u003e\",\n\t\t\"\u003cpre\u003e\u003ccode\",\n\t\t`href=\"../README.md\"`,\n\t\t`src=\"/raw/guide/diagram.png\"`,\n\t} {\n\t\tif !strings.Contains(rec.Body.String(), want) {\n\t\t\tt.Errorf(\"the page does not contain %s\", want)\n\t\t}\n\t}\n}\n\nfunc TestDocPageDropsActiveContent(t *testing.T) {\n\tt.Skip(\"HOLE(2): drop the active content of the markdown file\")\n\trec := get(newDocsPortal(t, sampleDocs), \"/docs/unsafe.md\")\n\tbody := rec.Body.String()\n\tif rec.Code != http.StatusOK || !strings.Contains(body, \"Click me\") {\n\t\tt.Fatalf(\"got %d %q\", rec.Code, body)\n\t}\n\tfor _, bad := range []string{\"\u003cscript\", \"javascript:\"} {\n\t\tif strings.Contains(body, bad) {\n\t\t\tt.Errorf(\"the page contains %s\", bad)\n\t\t}\n\t}\n}\n\nfunc TestDocPageReadsEachRequest(t *testing.T) {\n\tt.Skip(\"HOLE(2): read the markdown file on every request\")\n\tdocs := fstest.MapFS{\"a.md\": {Data: []byte(\"# First\\n\")}}\n\th := newDocsPortal(t, docs)\n\tif body := get(h, \"/docs/a.md\").Body.String(); !strings.Contains(body, \"First\") {\n\t\tt.Errorf(\"before the edit: %q\", body)\n\t}\n\n\tdocs[\"a.md\"] = \u0026fstest.MapFile{Data: []byte(\"# Second\\n\")}\n\tdocs[\"b.md\"] = \u0026fstest.MapFile{Data: []byte(\"# Added\\n\")}\n\tif body := get(h, \"/docs/a.md\").Body.String(); !strings.Contains(body, \"Second\") {\n\t\tt.Errorf(\"after the edit: %q\", body)\n\t}\n\tif body := get(h, \"/docs/\").Body.String(); !strings.Contains(body, `href=\"/docs/b.md\"`) {\n\t\tt.Errorf(\"the list after the addition: %q\", body)\n\t}\n\n\tdelete(docs, \"a.md\")\n\tif rec := get(h, \"/docs/a.md\"); rec.Code != http.StatusNotFound {\n\t\tt.Errorf(\"after the removal: %d\", rec.Code)\n\t}\n}\n\nfunc TestDocsNotFound(t *testing.T) {\n\tt.Skip(\"HOLE(2): answer 404 for a path without a markdown file\")\n\th := newDocsPortal(t, sampleDocs)\n\tfor _  in any title or body becomes a link that opens the\nentry, scrolls to it and marks it for a moment.\n\"\"\"\nimport hashlib\nimport html\nimport json\nimport os\nimport re\nimport sys\nfrom http.server import BaseHTTPRequestHandler, ThreadingHTTPServer\n\nROOT = os.path.dirname(os.path.dirname(os.path.abspath(__file__)))\nTODO = os.path.join(ROOT, \"todo.org\")\nHEADING = re.compile(r\"^(\\*+)\\s+(?:(TODO|DONE)\\s+)?(.*?)(?:\\s+(:[\\w@:.-]+:))?\\s*$\")\n\n\ndef parse(text):\n    \"\"\"Return the entries of an org file as a list of dicts, in document order.\"\"\"\n    entries, stack = [], []\n    for line in text.split(\"\\n\"):\n        m = HEADING.match(line)\n        if not m:\n            if entries:\n                entries[-1][\"body\"].append(line)\n            continue\n        level, state, title, tags = len(m.group(1)), m.group(2), m.group(3).strip(), m.group(4)\n        stack = stack[: level - 1] + [title]\n        path = \"/\".join(stack)\n        entries.append({\n            \"id\": hashlib.sha1(path.encode()).hexdigest()[:5],\n            \"level\": level,\n            \"state\": state or \"\",\n            \"title\": title,\n            \"tags\": [t for t in (tags or \"\").strip(\":\").split(\":\") if t],\n            \"body\": [],\n        })\n    for e in entries:\n        e[\"body\"] = \"\\n\".join(e[\"body\"]).strip(\"\\n\")\n    ids = {}\n    for e in entries:\n        ids.setdefault(e[\"id\"], []).append(e[\"title\"])\n    for e in entries:\n        e[\"duplicate\"] = len(ids[e[\"id\"]]) \u003e 1\n    return entries\n\n\ndef load():\n    with open(TODO, encoding=\"utf-8\") as f:\n        return parse(f.read())\n\n\nPAGE = \"\"\"\u003c!doctype html\u003e\n\u003cmeta charset=\"utf-8\"\u003e\n\u003ctitle\u003e{{PROJECT}} plan\u003c/title\u003e\n\u003cstyle\u003e\n  :root { --bg: #fff; --fg: #1a1a1a; --dim: #777; --done: #2a7; --todo: #c60; --id: #06c; --line: #e5e5e5; --code: #f3f3f3; --hl: #fff3b0; }\n  @media (prefers-color-scheme: dark) { :root { --bg: #161616; --fg: #e6e6e6; --dim: #999; --done: #5c9; --todo: #f93; --id: #6bf; --line: #333; --code: #262626; --hl: #4a3f10; } }\n  body { margin: 0; font: 14px/1.45 -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--fg); }\n  header { position: sticky; top: 0; background: var(--bg); border-bottom: 1px solid var(--line); padding: 8px 16px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }\n  header input[type=search] { flex: 1; min-width: 160px; padding: 4px 8px; font: inherit; }\n  main { padding: 8px 16px 48px; }\n  .entry { margin: 2px 0; }\n  .l1 { margin-left: 0; } .l2 { margin-left: 20px; } .l3 { margin-left: 40px; } .l4 { margin-left: 60px; } .l5 { margin-left: 80px; }\n  .head { display: flex; gap: 8px; align-items: baseline; cursor: pointer; }\n  .id { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--id); user-select: all; }\n  .id.dup { color: #d33; }\n  .state { font: 600 11px ui-monospace, Menlo, monospace; }\n  .state.DONE { color: var(--done); } .state.TODO { color: var(--todo); }\n  .l1 \u003e .head \u003e .title { font-weight: 700; font-size: 16px; }\n  .tags { color: var(--dim); font: 12px ui-monospace, Menlo, monospace; }\n  .body { display: none; margin: 4px 0 8px 52px; color: var(--dim); white-space: pre-wrap; max-width: 80ch; }\n  .entry.open \u003e .body { display: block; }\n  code { background: var(--code); padding: 0 3px; border-radius: 3px; font-size: 12.5px; color: var(--fg); }\n  .hidden { display: none; }\n  .entry.hl \u003e .head { background: var(--hl); border-radius: 4px; margin-left: -6px; padding: 2px 6px; }\n  .entry.hl \u003e .head \u003e .title::after { content: \" proposed\"; color: var(--todo); font: 600 11px ui-monospace, Menlo, monospace; margin-left: 6px; }\n  .count { color: var(--dim); }\n  #next { margin: 12px 16px 0; padding: 8px 14px 10px; border: 1px solid var(--line); border-left: 4px solid var(--todo); border-radius: 6px; }\n  #next h2 { margin: 0 0 4px; font-size: 15px; display: flex; gap: 8px; align-items: baseline; }\n  #next .body { display: block; margin: 4px 0 0; color: var(--fg); white-space: normal; }\n  #next p { margin: 0 0 4px; }\n  #next ul { margin: 0; padding-left: 20px; }\n  #next li { margin: 3px 0; }\n  #next .missing { color: var(--dim); }\n  a.ref { color: var(--id); font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; text-decoration: none; }\n  a.ref:hover { text-decoration: underline; }\n  .entry.flash \u003e .head { background: var(--hl); border-radius: 4px; }\n\u003c/style\u003e\n\u003cheader\u003e\n  \u003cstrong\u003etodo.org\u003c/strong\u003e\n  \u003clabel\u003e\u003cinput type=\"checkbox\" id=\"hideDone\"\u003e hide DONE\u003c/label\u003e\n  \u003clabel\u003e\u003cinput type=\"checkbox\" id=\"openAll\"\u003e open bodies\u003c/label\u003e\n  \u003cinput type=\"search\" id=\"q\" placeholder=\"filter by id, title, tag\"\u003e\n  \u003cspan class=\"count\" id=\"count\"\u003e\u003c/span\u003e\n\u003c/header\u003e\n\u003csection id=\"next\"\u003e\u003c/section\u003e\n\u003cmain id=\"plan\"\u003e\u003c/main\u003e\n\u003cscript\u003e\n  let last = \"\";\n  const hl = new Set((new URLSearchParams(location.search).get(\"hl\") || \"\").split(\",\").filter(Boolean));\n  let firstRender = true;\n  let known = new Set();\n  const esc = s =\u003e s.replace(/[\u0026\u003c\u003e\"]/g, c =\u003e ({\"\u0026\":\"\u0026amp;\",\"\u003c\":\"\u0026lt;\",\"\u003e\":\"\u0026gt;\",'\"':\"\u0026quot;\"}[c]));\n  const markup = s =\u003e esc(s).replace(/=([^=\\\\n]+)=/g, \"\u003ccode\u003e$1\u003c/code\u003e\").replace(/~([^~\\\\n]+)~/g, \"\u003ccode\u003e$1\u003c/code\u003e\")\n    .replace(/\\\\[\\\\[[^\\\\]]*\\\\]\\\\[([^\\\\]]*)\\\\]\\\\]/g, \"$1\")\n    .replace(/#([0-9a-f]{5})\\\\b/g, (m, id) =\u003e known.has(id) ? `\u003ca class=\"ref\" href=\"#e-${id}\" data-ref=\"${id}\"\u003e#${id}\u003c/a\u003e` : m);\n  function listMarkup(body) {\n    const paras = [], items = [];\n    for (const line of bo <script>
(function () {
  "use strict";
  const data = JSON.parse(document.getElementById("data").textContent);
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const other = (version) => (version === "before" ? "after" : "before");
  const viewNames = { before: "Before", diff: "Diff", after: "After" };
  // line and end select lines of the open file: a definition's line, or a declaration's lines.
  const state = { diagram: 0, view: {}, file: null, key: null, line: null, end: null, fileView: "after" };
  const emptyCode = $("code-body").innerHTML;
  const emptyStatus = $("code-status").innerHTML;
  const refsLink = $("refs-link");
  const refs = $("refs");
  const implsLink = $("impls-link");
  const impls = $("impls");

  $("title").textContent = data.title;
  $("subtitle").textContent = data.base
    ? "Before is " + data.base.slice(0, 12) + ", and After is the working tree."
    : "The working tree alone, with no base to compare against.";

  function tabs(container, items, selected, onSelect) {
    container.innerHTML = "";
    items.forEach((item) => {
      const b = document.createElement("button");
      b.type = "button";
      b.setAttribute("role", "tab");
      b.setAttribute("aria-selected", String(item.id === selected));
      b.textContent = item.label;
      if (item.hint) {
        b.title = item.hint;
      }
      if (item.mark) {
        const star = document.createElement("span");
        star.className = "mark " + item.mark;
        star.textContent = marks[item.mark].glyph;
        star.title = item.markTip;
        b.appendChild(star);
      }
      b.addEventListener("click", () => onSelect(item.id));
      container.appendChild(b);
    });
  }

  // The diagrams, each in its views.
  let marked = null; // for each diagram, the strongest mark of the declarations its drawings link

  function selectDiagram(i) {
    state.diagram = i;
    marked = marked || data.diagrams.map(tabMark);
    // A tab shows the diagram's number. Its title, the description of the expanded
    // process, shows on hover and above the drawing.
    tabs($("tabs"), data.diagrams.map((d, k) => ({
      id: k, label: d.number || "Overview", hint: d.number ? d.title : "",
      mark: marked[k],
      markTip: (marked[k] === "changed" ? "shows a declaration changed since " : "shows a function whose calls reach a change since ") + data.base,
    })), i, (k) => navigate(() => selectDiagram(k)));
    const d = data.diagrams[i];
    $("diagram-title").textContent = d.title;
    const present = ["before", "diff", "after"].filter((v) => d[v]);
    showView(present.includes(state.view[i]) ? state.view[i] : defaultView(d));
    uncoveredList(d);
  }

  // uncoveredList lists, under the Overview drawing, the changed declarations and methods that
  // no drawing covers, each with its mark and a link to its declaration.
  function uncoveredList(d) {
    const box = $("uncovered");
    box.innerHTML = "";
    if (d.number !== "" || !(data.uncovered || []).length) {
      return;
    }
    const h = document.createElement("h2");
    h.textContent = "Changes outside the drawings";
    const p = document.createElement("p");
    p.className = "muted";
    p.textContent = "No drawing links these declarations, and no linked function reaches them through its calls.";
    const ul = document.createElement("ul");
    data.uncovered.forEach((u) => {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.href = "#";
      a.className = "ident mark-" + u.mark;
      a.textContent = u.key;
      a.title = marks[u.mark].tip + data.base;
      a.addEventListener("click", (e) => {
        e.preventDefault();
        navigate(() => showDecl(u.key, u.version));
      });
      const where = document.createElement("span");
      where.className = "muted";
      where.textContent = u.file + ":" + u.line + (u.version === "before" ? " (Before)" : "");
      li.append(a, where);
      ul.appendChild(li);
    });
    box.append(h, p, ul);
  }

  // defaultView returns the view a diagram opens in: Diff when it changed, else its one view.
  function defaultView(d) {
    const present = ["before", "diff", "after"].filter((v) => d[v]);
    return present.includes("diff") ? "diff" : present[present.length - 1];
  }

  function showView(view) {
    const d = data.diagrams[state.diagram];
    state.view[state.diagram] = view;
    const present = ["before", "diff", "after"].filter((v) => d[v]);
    tabs($("views"), present.length > 1 ? present.map((v) => ({ id: v, label: viewNames[v] })) : [], view, (v) => {
      showView(v);
      record(false);
    });
    $("drawing").innerHTML = d[view] || "";
    const svg = $("drawing").querySelector("svg");
    if (svg) {
      decorate(svg, view);
    }
  }

  // The Before view reads the base; the Diff and After views read the working tree.
  const versionOf = (view) => (view === "before" ? "before" : "after");

  function decorate(svg, view) {
    const version = versionOf(view);
    svg.querySelectorAll("a[href]").forEach((a) => {
      const href = a.getAttribute("href");
      if (href.startsWith("#term/")) {
        const term = decodeURIComponent(href.slice(6));
        const def = (data.terms[version] || {})[term] || (data.terms[other(version)] || {})[term];
        if (def) {
          const t = document.createElementNS("http://www.w3.org/2000/svg", "title");
          t.textContent = term + ": " + def;
          a.appendChild(t);
        }
      } else if (href.startsWith("#code/")) {
        const decl = data.decls[href.slice(6)];
        if (!decl || (!decl.before && !decl.after)) {
          a.classList.add("missing");
        } else if (markOf(decl)) {
          markLink(a, markOf(decl));
        }
      } else if (href.startsWith("#type/")) {
        const decl = data.decls[typeKey(typeOf(data.diagrams[state.diagram], decodeURIComponent(href.slice(6)), version))];
        if (markOf(decl)) {
          markLink(a, markOf(decl));
        }
      } else if (/^https?:/.test(href)) {
        a.setAttribute("target", "_blank");
        a.setAttribute("rel", "noopener");
      }
    });
    const here = data.diagrams[state.diagram].number;
    svg.querySelectorAll("text").forEach((t) => {
      const n = t.textContent.trim();
      const child = data.diagrams.findIndex((d) => d.number !== "" && d.number === n && parentOf(d.number) === here);
      if (child >= 0 && !t.closest("a")) {
        t.classList.add("child");
        t.setAttribute("tabindex", "0");
        t.setAttribute("role", "link");
        t.addEventListener("click", () => navigate(() => selectDiagram(child)));
        t.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            navigate(() => selectDiagram(child));
          }
        });
      }
    });
    svg.addEventListener("click", (e) => {
      const a = e.target.closest("a[href]");
      if (!a) {
        return;
      }
      const href = a.getAttribute("href");
      if (href.startsWith("#code/")) {
        e.preventDefault();
        navigate(() => showDecl(href.slice(6), version));
      } else if (href.startsWith("#type/")) {
        e.preventDefault();
        navigate(() => showType(decodeURIComponent(href.slice(6)), version));
      } else if (href.startsWith("#")) {
        e.preventDefault();
      }
    });
  }

  // The two marks of a changed declaration: a change in its own text, or in its reach only.
  const marks = {
    changed: { glyph: "*", tip: "changed since " },
    reached: { glyph: "~", tip: "calls a function or method changed since " },
  };

  // markOf returns a declaration's mark: "changed", "reached" or "".
  const markOf = (decl) => (!decl || !decl.changed ? "" : decl.reached ? "reached" : "changed");

  // tabMark returns the strongest mark among the declarations that a diagram's drawings link.
  function tabMark(d) {
    let best = "";
    ["before", "diff", "after"].forEach((view) => {
      for (const m of (d[view] || "").matchAll(/href="#(code|type)\/([^"]*)"/g)) {
        const key = m[1] === "code" ? m[2] : typeKey(typeOf(d, decodeURIComponent(m[2]), versionOf(view)));
        const kind = markOf(data.decls[key]);
        if (kind === "changed" || (kind === "reached" && !best)) {
          best = kind;
        }
      }
    });
    // The Overview also shows the changes outside the drawings.
    if (d.number === "") {
      (data.uncovered || []).forEach((u) => {
        if (u.mark === "changed" || (u.mark === "reached" && !best)) {
          best = u.mark;
        }
      });
    }
    return best;
  }

  // markLink puts a highlight behind a link of a changed declaration and its mark after it.
  function markLink(a, kind) {
    const svg = "http://www.w3.org/2000/svg";
    const name = a.querySelector("tspan");
    const text = a.closest("text");
    if (name && text) {
      const box = name.getBBox();
      const rect = document.createElementNS(svg, "rect");
      Object.entries({ x: box.x - 1, y: box.y, width: box.width + 2, height: box.height, rx: 2 }).forEach(([k, v]) => rect.setAttribute(k, v));
      rect.setAttribute("class", "hl " + kind);
      text.before(rect);
    }
    const star = document.createElementNS(svg, "tspan");
    star.classList.add(kind);
    star.textContent = marks[kind].glyph;
    const t = document.createElementNS(svg, "title");
    t.textContent = marks[kind].tip + data.base;
    a.append(star, t);
  }

  function parentOf(number) {
    const i = number.lastIndexOf(".");
    return i < 0 ? "" : number.slice(0, i);
  }

  // The code panel. status shows a message above the code and hides the "Show references"
  // and "Show implementations" links, which renderFile shows again for a declaration or a
  // method, and for an interface.
  function status(html) {
    $("code-status").innerHTML = html;
    refsLink.hidden = true;
    implsLink.hidden = true;
    closeRefs();
    closeImpls();
  }

  function placeOf(key, version) {
    return (data.decls[key] || {})[version] || null;
  }

  function showDecl(key, version) {
    const place = placeOf(key, version) || placeOf(key, other(version));
    if (!place) {
      status(esc(key) + " has no declaration in either version.");
      return false;
    }
    openFile(place.file, placeOf(key, version) ? version : other(version), key);
    return true;
  }

  // typeOf returns a flow item's type in diagram d, from the other version when this one lacks it.
  function typeOf(d, item, version) {
    return (d.types[version] || {})[item] || (d.types[other(version)] || {})[item] || "";
  }

  // typeKey returns the declaration key of a type's first qualified name, such as lib.Item in []*lib.Item.
  function typeKey(type) {
    const m = /\b([a-z][a-z0-9_]*)\.([A-Za-z_][A-Za-z0-9_]*)/.exec(type);
    return m ? m[1] + "." + m[2] : "";
  }

  function showType(item, version) {
    const type = typeOf(data.diagrams[state.diagram], item, version);
    if (!type) {
      status(esc(item) + " has no type comment.");
      return;
    }
    const key = typeKey(type);
    if (!key || !showDecl(key, version)) {
      status(esc(item) + ": " + esc(type));
      return;
    }
    $("code-status").innerHTML = esc(item) + ": " + esc(type) + "<br>" + $("code-status").innerHTML;
  }

  function openFile(path, view, key) {
    state.file = path;
    state.key = key || null;
    state.line = null;
    state.end = null;
    state.fileView = view;
    renderFile();
  }

  // changedLines returns the status of each changed line of a file's After version, by line
  // number, from the file's unified diff: "modified" for a line that replaces removed lines,
  // and "added" for any other added line.
  function changedLines(diff) {
    const status = {};
    let line = 0; // the After version's number of the next line, 0 before the first hunk
    let removed = 0;
    let added = [];
    const flush = () => {
      added.forEach((n) => {
        status[n] = removed > 0 ? "modified" : "added";
      });
      removed = 0;
      added = [];
    };
    (diff || "").split("\n").forEach((ln) => {
      const hunk = /^@@ -\d+(?:,\d+)? \+(\d+)/.exec(ln);
      if (hunk) {
        flush();
        line = Number(hunk[1]);
      } else if (line === 0 || ln.startsWith("\\")) {
        // The file's header, or a note such as "\ No newline at end of file".
      } else if (ln.startsWith("+")) {
        added.push(line++);
      } else if (ln.startsWith("-")) {
        removed++;
      } else {
        flush();
        line++;
      }
    });
    flush();
    return status;
  }

  // The identifier links of the open file's view, by line; renderFile fills it.
  let lineLinks = {};

  // linkLine wraps each identifier of line n of the open file, in its highlighted html,
  // in a link to the identifier's definition in the same version.
  function linkLine(html, n, version) {
    const links = lineLinks[n];
    if (!links) {
      return html;
    }
    const t = document.createElement("template");
    t.innerHTML = html;
    const texts = [];
    let offset = 0; // UTF-16 code units before each text node
    const walker = document.createTreeWalker(t.content, NodeFilter.SHOW_TEXT);
    for (let node = walker.nextNode(); node; node = walker.nextNode()) {
      texts.push({ node, start: offset });
      offset += node.data.length;
    }
    // From the last identifier back, so a split leaves the earlier offsets of its node valid.
    [...links].sort((a, b) => b.c - a.c).forEach((link) => {
      const from = link.c - 1;
      const text = texts.find((x) => from >= x.start && from + link.n <= x.start + x.node.data.length);
      if (!text) {
        return;
      }
      const name = text.node.splitText(from - text.start);
      name.splitText(link.n);
      const a = document.createElement("a");
      a.className = link.m ? "ident mark-" + link.m : "ident";
      if (link.m) {
        a.title = marks[link.m].tip + data.base;
      }
      if (link.u) {
        a.href = link.u;
        a.target = "_blank";
        a.rel = "noopener";
      } else {
        a.href = "#";
        if (link.k) {
          a.dataset.key = link.k;
        }
        a.dataset.file = link.f;
        a.dataset.line = link.t;
        if (link.e) {
          a.dataset.end = link.e;
        }
        a.dataset.version = version;
      }
      name.replaceWith(a);
      a.appendChild(name);
    });
    return t.innerHTML;
  }

  // openDefinition opens a link's definition: its file in the same version at its line, with
  // the key of its declaration or method, or its URL. The link of a declaration's name
  // selects the declaration's lines instead.
  function openDefinition(link, version) {
    if (link.u) {
      window.open(link.u, "_blank", "noopener");
      return;
    }
    state.file = link.f;
    state.key = link.k || null;
    state.line = link.t;
    state.end = link.e || null;
    state.fileView = version;
    renderFile();
  }

  function renderFile() {
    const f = data.files[state.file];
    if (!f) {
      status(esc(state.file) + " is not on the page.");
      $("code-views").innerHTML = "";
      $("code-body").innerHTML = "";
      return;
    }
    const present = ["before", "diff", "after"].filter((v) => (v === "diff" ? f.diff : f[v] !== null));
    if (!present.includes(state.fileView)) {
      state.fileView = present[present.length - 1];
    }
    tabs($("code-views"), present.length > 1 ? present.map((v) => ({ id: v, label: viewNames[v] })) : [], state.fileView, (v) => {
      state.fileView = v;
      renderFile();
      record(false);
    });
    // The selection: a declaration's lines, from the link of its name or from its key, and
    // inside them the line that a link opened, such as a definition or a reference, as the
    // focus. Without a declaration that holds it, that line stands alone.
    let where = null;
    let focus = null;
    if (state.fileView !== "diff") {
      const decl = state.key ? placeOf(state.key, state.fileView) : null;
      const holds = decl && decl.file === state.file && (!state.line || (state.line >= decl.start && state.line <= decl.end));
      if (state.end) {
        where = { start: state.line, end: state.end };
      } else if (holds) {
        where = decl;
        focus = state.line;
      } else if (state.line) {
        where = { start: state.line, end: state.line };
      }
    }
    const at = focus || (where && where.start);
    let label = esc(state.file) + (state.line ? ":" + state.line : "") + " (" + viewNames[state.fileView] + ")";
    if (state.key) {
      label = esc(state.key) + " in " + esc(state.file) + (at ? ":" + at : "") + " (" + viewNames[state.fileView] + ")";
    }
    status(label);
    refsLink.hidden = !state.key;
    implsLink.hidden = !implementationsOf(state.key);
    const out = [];
    if (state.fileView === "diff") {
      f.diff.replace(/\n$/, "").split("\n").forEach((ln, i) => {
        let cls = "";
        if (ln.startsWith("@@")) {
          cls = " hunk";
        } else if (ln.startsWith("+") && !ln.startsWith("+++")) {
          cls = " add";
        } else if (ln.startsWith("-") && !ln.startsWith("---")) {
          cls = " del";
        }
        out.push('<div class="line' + cls + '"><span class="n">' + (i + 1) + '</span><span class="s">' + esc(ln) + "</span></div>");
      });
    } else {
      const go = state.file.endsWith(".go") && window.hljs;
      const changed = state.fileView === "after" ? changedLines(f.diff) : {};
      lineLinks = {};
      (f[state.fileView + "Links"] || []).forEach((l) => {
        (lineLinks[l.l] = lineLinks[l.l] || []).push(l);
      });
      f[state.fileView].replace(/\n$/, "").split("\n").forEach((ln, i) => {
        const n = i + 1;
        const sel = (where && n >= where.start && n <= where.end ? " sel" : "") + (n === focus ? " focus" : "") +
          (changed[n] ? " " + changed[n] : "");
        const src = linkLine(go ? hljs.highlight(ln, { language: "go", ignoreIllegals: true }).value : esc(ln), n, state.fileView);
        out.push('<div class="line' + sel + '" id="L' + n + '"><span class="n">' + n + '</span><span class="s">' + src + "</span></div>");
      });
    }
    $("code-body").innerHTML = out.join("");
    // The panel scrolls to the selection's first line, or to the focus when that line would
    // leave the focus out of view.
    const first = where && document.getElementById("L" + where.start);
    const marked = focus && document.getElementById("L" + focus);
    const room = $("code").clientHeight - $("code-head").offsetHeight - 36;
    const target = first && marked && marked.offsetTop - first.offsetTop > room ? marked : first;
    $("code").scrollTop = target ? target.offsetTop - $("code-head").offsetHeight - 12 : 0;
  }

  // packageErrors lists the package errors of both versions.
  function packageErrors() {
    const ul = document.createElement("ul");
    ul.className = "errors";
    data.errors.forEach((e) => {
      const li = document.createElement("li");
      li.textContent = e;
      ul.appendChild(li);
    });
    return ul;
  }

  // The notes under the drawings.
  function section(title, content) {
    const h = document.createElement("h2");
    h.textContent = title;
    $("notes").appendChild(h);
    $("notes").appendChild(content);
  }

  function prose(text) {
    const div = document.createElement("div");
    div.className = "prose";
    text.split(/\n\s*\n/).forEach((para) => {
      const p = document.createElement("p");
      p.textContent = para.replace(/\n/g, " ");
      div.appendChild(p);
    });
    return div;
  }

  function scoreTable() {
    const old = data.oldScore;
    const rows = ["<tr><th>Column</th><th>Cached</th><th>New</th><th>Change</th></tr>"];
    data.newScore.columns.forEach((col, i) => {
      const now = Number(data.newScore.values[i]);
      const k = old ? old.columns.indexOf(col) : -1;
      const before = k >= 0 ? Number(old.values[k]) : null;
      let change = "";
      if (before !== null && !Number.isNaN(now) && !Number.isNaN(before)) {
        const d = now - before;
        change = d > 0 ? '<span class="rise">+' + d + " rise</span>" : d < 0 ? '<span class="fall">' + d + "</span>" : "0";
      }
      rows.push("<tr><td>" + esc(col) + '</td><td class="num">' + (before === null ? "" : before) + '</td><td class="num">' +
        esc(data.newScore.values[i]) + '</td><td class="num">' + change + "</td></tr>");
    });
    const t = document.createElement("table");
    t.innerHTML = rows.join("");
    return t;
  }

  function vocabularyChanges() {
    const before = data.terms.before || {};
    const after = data.terms.after || {};
    const names = Array.from(new Set(Object.keys(before).concat(Object.keys(after)))).sort();
    const rows = [];
    names.forEach((term) => {
      let kind = "";
      if (!(term in before)) {
        kind = "added";
      } else if (!(term in after)) {
        kind = "removed";
      } else if (before[term] !== after[term]) {
        kind = "changed";
      }
      if (kind) {
        rows.push('<tr><td class="' + kind + '">' + kind + "</td><td>" + esc(term) + "</td><td>" + esc(after[term] || before[term]) + "</td></tr>");
      }
    });
    const t = document.createElement("table");
    t.innerHTML = rows.length ? rows.join("") : '<tr><td class="muted">No changes.</td></tr>';
    return t;
  }

  function changedFiles() {
    const ul = document.createElement("ul");
    ul.className = "files";
    (data.changed || []).forEach((c) => {
      const li = document.createElement("li");
      const s = document.createElement("span");
      s.className = "status " + ({ added: "added", deleted: "removed" }[c.status] || "changed");
      s.textContent = c.status;
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = c.path;
      b.addEventListener("click", () => navigate(() => openFile(c.path, "diff", null)));
      li.appendChild(s);
      li.appendChild(b);
      ul.appendChild(li);
    });
    if (!ul.children.length) {
      ul.innerHTML = '<li class="muted">No changes.</li>';
    }
    return ul;
  }

  if (data.brief) {
    section("The change in brief", prose(data.brief));
  }
  if (data.metaphor) {
    section("Metaphor", prose(data.metaphor));
  }
  if (data.newScore) {
    section("Score", scoreTable());
  }
  if (data.base) {
    section("Vocabulary changes", vocabularyChanges());
    section("Changed files", changedFiles());
  }
  if (data.report) {
    const pre = document.createElement("pre");
    pre.className = "report";
    pre.textContent = data.report;
    section("dfdmetrics report", pre);
  }
  if (data.errors && data.errors.length) {
    section("Package errors", packageErrors());
  }
  $("code-body").addEventListener("click", (e) => {
    const a = e.target.closest("a.ident");
    if (a && a.dataset.file) {
      e.preventDefault();
      navigate(() => openDefinition({ f: a.dataset.file, t: Number(a.dataset.line), e: Number(a.dataset.end), k: a.dataset.key }, a.dataset.version));
    }
  });

  // The search box lists the declarations and methods whose keys match its text, and opens
  // the chosen one in the code panel.
  const search = $("search");
  const results = $("search-results");
  const shown = 50; // the most results that the list shows
  let found = []; // the keys that match the text, best first
  let active = -1; // the index of the highlighted result, -1 for none

  // matching returns the keys of the declarations and methods that match query, best first:
  // those named query, then those whose names start with it, then those whose keys hold it.
  function matching(query) {
    const q = query.trim().toLowerCase();
    if (!q) {
      return [];
    }
    const scored = [];
    Object.keys(data.decls).forEach((key) => {
      const k = key.toLowerCase();
      const name = k.slice(k.lastIndexOf(".") + 1);
      const score = name === q ? 0 : name.startsWith(q) ? 1 : k.includes(q) ? 2 : -1;
      if (score >= 0) {
        scored.push({ key, score });
      }
    });
    scored.sort((a, b) => a.score - b.score || (a.key < b.key ? -1 : a.key > b.key ? 1 : 0));
    return scored.map((s) => s.key);
  }

  function showResults() {
    found = matching(search.value);
    results.replaceChildren();
    found.slice(0, shown).forEach((key, i) => {
      const decl = data.decls[key];
      const version = decl.after ? "after" : "before";
      const where = decl[version];
      const li = document.createElement("li");
      li.id = "result-" + i;
      li.setAttribute("role", "option");
      li.dataset.key = key;
      li.dataset.index = i;
      const kind = document.createElement("span");
      kind.className = "kind";
      kind.textContent = where.kind;
      const name = document.createElement("span");
      name.textContent = key;
      li.append(kind, name);
      const m = markOf(decl);
      if (m) {
        const star = document.createElement("span");
        star.className = "mark " + m;
        star.textContent = marks[m].glyph;
        star.title = marks[m].tip + data.base;
        li.append(star);
      }
      const place = document.createElement("span");
      place.className = "where";
      place.textContent = where.file + ":" + where.start + (version === "before" ? " (Before)" : "");
      li.append(place);
      results.appendChild(li);
    });
    const typed = search.value.trim() !== "";
    const note = found.length > shown ? found.length - shown + " more; type more of the name to narrow the list."
      : typed && !found.length ? "No declaration or method matches." : "";
    if (note) {
      const li = document.createElement("li");
      li.className = "note";
      li.textContent = note;
      results.appendChild(li);
    }
    results.hidden = !typed;
    search.setAttribute("aria-expanded", String(typed));
    setActive(found.length ? 0 : -1);
  }

  function setActive(i) {
    active = i;
    results.querySelectorAll("li[data-key]").forEach((li) => {
      const on = Number(li.dataset.index) === i;
      li.classList.toggle("active", on);
      li.setAttribute("aria-selected", String(on));
      if (on) {
        li.scrollIntoView({ block: "nearest" });
      }
    });
    if (i >= 0) {
      search.setAttribute("aria-activedescendant", "result-" + i);
    } else {
      search.removeAttribute("aria-activedescendant");
    }
  }

  function closeResults() {
    results.hidden = true;
    search.setAttribute("aria-expanded", "false");
  }

  // choose opens a declaration or method in the version of the open file.
  function choose(key) {
    closeResults();
    navigate(() => showDecl(key, state.fileView === "before" ? "before" : "after"));
  }

  search.addEventListener("input", showResults);
  search.addEventListener("focus", () => {
    if (search.value.trim()) {
      showResults();
    }
  });
  search.addEventListener("blur", closeResults);
  search.addEventListener("keydown", (e) => {
    const n = Math.min(found.length, shown);
    if ((e.key === "ArrowDown" || e.key === "ArrowUp") && n) {
      e.preventDefault();
      if (results.hidden) {
        showResults();
      } else {
        setActive((active + (e.key === "ArrowDown" ? 1 : n - 1)) % n);
      }
    } else if (e.key === "Enter" && !results.hidden && active >= 0) {
      e.preventDefault();
      choose(found[active]);
    } else if (e.key === "Escape" && !results.hidden) {
      e.preventDefault();
      closeResults();
    }
  });
  // A press on the list keeps the focus in the box, so the list stays open until the click.
  results.addEventListener("mousedown", (e) => e.preventDefault());
  results.addEventListener("mousemove", (e) => {
    const li = e.target.closest("li[data-key]");
    if (li && Number(li.dataset.index) !== active) {
      setActive(Number(li.dataset.index));
    }
  });
  results.addEventListener("click", (e) => {
    const li = e.target.closest("li[data-key]");
    if (li) {
      choose(li.dataset.key);
    }
  });

  // The "Show references" link lists the uses of the open declaration or method in the open
  // version, one line for each declaration or method that holds some, with their lines.
  function openRefs() {
    closeImpls();
    const version = state.fileView === "before" ? "before" : "after";
    const list = ((data.uses || {})[version] || {})[state.key] || [];
    const groups = new Map();
    list.forEach((u) => {
      const id = (u.i || "") + " " + u.f;
      if (!groups.has(id)) {
        groups.set(id, { key: u.i || "", file: u.f, lines: [] });
      }
      groups.get(id).lines.push(u.l);
    });
    const head = document.createElement("p");
    head.textContent = (list.length ? "References to " : "No references to ") + state.key + " in the " + viewNames[version] +
      " version" + (list.length ? ":" : ".");
    refs.replaceChildren(head);
    if (list.length) {
      const ul = document.createElement("ul");
      groups.forEach((g) => {
        const li = document.createElement("li");
        const where = document.createElement("span");
        where.className = "where";
        where.append(g.file + ":");
        g.lines.forEach((line, i) => {
          if (i) {
            where.append(", ");
          }
          where.append(refLink(String(line), g, line, version));
        });
        li.append(refLink(g.key || g.file, g, g.lines[0], version), where);
        ul.appendChild(li);
      });
      refs.appendChild(ul);
    }
    refs.hidden = false;
    refsLink.textContent = "Hide references";
    refsLink.setAttribute("aria-expanded", "true");
  }

  // refLink returns a link to a line of a group's file, which opens with the group's key.
  function refLink(text, group, line, version) {
    const a = document.createElement("a");
    a.href = "#";
    a.textContent = text;
    if (group.key) {
      a.dataset.key = group.key;
    }
    a.dataset.file = group.file;
    a.dataset.line = line;
    a.dataset.version = version;
    return a;
  }

  function closeRefs() {
    refs.hidden = true;
    refs.replaceChildren();
    refsLink.textContent = "Show references";
    refsLink.setAttribute("aria-expanded", "false");
  }

  // implementationsOf returns the types that implement an interface in the open version, or
  // null for a key of anything else.
  function implementationsOf(key) {
    const all = (data.implementations || {})[state.fileView === "before" ? "before" : "after"] || {};
    return key && Object.prototype.hasOwnProperty.call(all, key) ? all[key] : null;
  }

  // The "Show implementations" link lists the types that implement the open interface in the
  // open version, a type marked with "*" when only its pointer implements it.
  function openImpls() {
    closeRefs();
    const version = state.fileView === "before" ? "before" : "after";
    const list = implementationsOf(state.key) || [];
    const head = document.createElement("p");
    head.textContent = (list.length ? "Implementations of " : "No implementations of ") + state.key + " in the " +
      viewNames[version] + " version" + (list.length ? ":" : ".");
    impls.replaceChildren(head);
    if (list.length) {
      const ul = document.createElement("ul");
      list.forEach((m) => {
        const li = document.createElement("li");
        const where = document.createElement("span");
        where.className = "where";
        where.textContent = m.f + ":" + m.l;
        li.append(refLink((m.p ? "*" : "") + m.k, { key: m.k, file: m.f }, m.l, version), where);
        ul.appendChild(li);
      });
      impls.appendChild(ul);
    }
    impls.hidden = false;
    implsLink.textContent = "Hide implementations";
    implsLink.setAttribute("aria-expanded", "true");
  }

  function closeImpls() {
    impls.hidden = true;
    impls.replaceChildren();
    implsLink.textContent = "Show implementations";
    implsLink.setAttribute("aria-expanded", "false");
  }

  refsLink.addEventListener("click", () => (refs.hidden ? openRefs() : closeRefs()));
  implsLink.addEventListener("click", () => (impls.hidden ? openImpls() : closeImpls()));
  [refs, impls].forEach((list) => list.addEventListener("click", (e) => {
    const a = e.target.closest("a[data-file]");
    if (a) {
      e.preventDefault();
      navigate(() => openDefinition({ f: a.dataset.file, t: Number(a.dataset.line), k: a.dataset.key }, a.dataset.version));
    }
  }));
  // A click elsewhere, or Escape, closes the lists.
  document.addEventListener("click", (e) => {
    if (!e.target.closest("#refs, #refs-link, #impls, #impls-link")) {
      closeRefs();
      closeImpls();
    }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      closeRefs();
      closeImpls();
    }
  });

  // The history: each navigation adds an entry, and a switch of view updates the current one,
  // so the Back button returns to the previous place. An entry's URL hash names its place, as
  // in #d=3.3&v=diff&f=cart/cart.go&fv=after&l=21, and a hash such as #code/analyze.sumTypes
  // opens that declaration.
  const place = () => ({
    diagram: state.diagram, view: { ...state.view },
    file: state.file, key: state.key, line: state.line, end: state.end, fileView: state.fileView,
  });

  function hashOf(p) {
    const parts = [];
    const add = (name, value) => {
      if (value) {
        parts.push(name + "=" + encodeURIComponent(value).replace(/%2F/g, "/"));
      }
    };
    const d = data.diagrams[p.diagram] || {};
    add("d", d.number);
    if (p.view[p.diagram] !== defaultView(d)) {
      add("v", p.view[p.diagram]);
    }
    if (p.file) {
      add("f", p.file);
      add("fv", p.fileView);
      add("k", p.key);
      add("l", p.line ? String(p.line) : "");
      add("e", p.end ? String(p.end) : "");
    }
    return parts.length ? "#" + parts.join("&") : "";
  }

  // placeOfHash reads a place from a hash that hashOf wrote.
  function placeOfHash(hash) {
    const q = new URLSearchParams(hash.slice(1));
    const diagram = Math.max(0, data.diagrams.findIndex((d) => d.number === (q.get("d") || "")));
    const view = q.get("v") ? { [diagram]: q.get("v") } : {};
    return {
      diagram, view, file: q.get("f"), key: q.get("k"),
      line: Number(q.get("l")) || null, end: Number(q.get("e")) || null, fileView: q.get("fv") || "after",
    };
  }

  function record(push) {
    const p = place();
    const url = location.href.split("#")[0] + hashOf(p);
    if (push) {
      history.pushState(p, "", url);
    } else {
      history.replaceState(p, "", url);
    }
  }

  // navigate runs a step, and adds a history entry when the step changes the place.
  function navigate(step) {
    const before = hashOf(place());
    step();
    if (hashOf(place()) !== before) {
      record(true);
    }
  }

  function restore(p) {
    state.view = { ...p.view };
    selectDiagram(p.diagram);
    Object.assign(state, { file: p.file, key: p.key, line: p.line, end: p.end || null, fileView: p.fileView });
    if (state.file) {
      renderFile();
    } else {
      $("code-views").innerHTML = "";
      $("code-body").innerHTML = emptyCode;
      status(emptyStatus);
    }
  }

  // openHash opens the place that a URL hash names, and the top diagram for an empty one.
  function openHash(hash) {
    if (hash.startsWith("#code/")) {
      selectDiagram(0);
      showDecl(decodeURIComponent(hash.slice(6)), "after");
    } else {
      restore(hash.length > 1 ? placeOfHash(hash) : { diagram: 0, view: {}, file: null, key: null, line: null, end: null, fileView: "after" });
    }
  }

  if (data.diagrams.length) {
    openHash(location.hash);
    record(false);
  }
  // An entry without a state comes from a change of the hash alone, as in an edited URL.
  window.addEventListener("popstate", (e) => {
    if (e.state) {
      restore(e.state);
    } else {
      openHash(location.hash);
      record(false);
    }
  });

  // The splitter resizes the code panel, and this browser keeps the width.
  const main = document.querySelector("main");
  const splitter = $("splitter");
  const widthKey = "dfdreview.codeWidth";
  function setCodeWidth(px) {
    const width = Math.max(240, Math.min(px, main.clientWidth - 320));
    main.style.setProperty("--code-width", width + "px");
    return width;
  }
  function saveCodeWidth(width) {
    try {
      localStorage.setItem(widthKey, String(width));
    } catch (e) {
      // Without storage, the width lasts until the page reloads.
    }
  }
  try {
    const saved = Number(localStorage.getItem(widthKey));
    if (saved > 0) {
      setCodeWidth(saved);
    }
  } catch (e) {
    // Without storage, the panel keeps its default width.
  }
  splitter.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    splitter.setPointerCapture(e.pointerId);
    splitter.classList.add("dragging");
    document.body.classList.add("resizing");
  });
  splitter.addEventListener("pointermove", (e) => {
    if (splitter.hasPointerCapture(e.pointerId)) {
      setCodeWidth(main.getBoundingClientRect().right - e.clientX);
    }
  });
  splitter.addEventListener("pointerup", (e) => {
    splitter.releasePointerCapture(e.pointerId);
    splitter.classList.remove("dragging");
    document.body.classList.remove("resizing");
    saveCodeWidth($("code").offsetWidth);
  });
  splitter.addEventListener("keydown", (e) => {
    const step = e.shiftKey ? 80 : 20;
    if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
      e.preventDefault();
      const wider = e.key === "ArrowLeft" ? step : -step;
      saveCodeWidth(setCodeWidth($("code").offsetWidth + wider));
    }
  });
  splitter.addEventListener("dblclick", () => {
    main.style.removeProperty("--code-width");
    try {
      localStorage.removeItem(widthKey);
    } catch (e) {
      // Without storage, there is no saved width to forget.
    }
  });
  window.addEventListener("resize", () => {
    if (main.style.getPropertyValue("--code-width")) {
      setCodeWidth($("code").offsetWidth);
    }
  });
})();
</script>
</body>
</html>
