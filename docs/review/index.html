* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--paper); color: var(--ink); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }

#search-results .where { margin-left: auto; padding-left: 16px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }

main { display: grid; grid-template-columns: minmax(0, 1fr) 7px var(--code-width, 40%); height: calc(100% - 58px); }
#left { overflow: auto; padding: 12px 16px 32px; }
#splitter { cursor: col-resize; background: var(--rule); border-left: 3px solid var(--paper); border-right: 3px solid var(--panel); }
#splitter:hover, #splitter.dragging, #splitter:focus-visible { background: var(--sel-rule); outline: none; }
body.resizing { cursor: col-resize; user-select: none; }

.tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }

.tabs.small button { font-size: 12px; padding: 2px 8px; }
.tabs button .mark { color: var(--del); font-weight: 700; margin-left: 2px; }

#drawing svg { display: block; max-width: 100%; height: auto; background: #fff; border: 1px solid var(--rule); border-radius: 6px; }
#drawing a[href] { cursor: pointer; }
#drawing a[href]:hover tspan, #drawing a[href]:focus tspan { fill: #4a37b0; }
#drawing .child { cursor: pointer; fill: #4a37b0; text-decoration: underline; }
#drawing .missing tspan { fill: #b3261e; }
/* A larger asterisk stays visible in a scaled-down drawing; the shift keeps it on its line. */

#drawing rect.hl.changed { fill: #fde2df; }
#drawing rect.hl.reached { fill: #fcefd6; }
#drawing a[href] tspan.reached, #drawing a[href]:hover tspan.reached, #drawing a[href]:focus tspan.reached {

.line.sel { background: var(--sel); box-shadow: inset 3px 0 0 var(--sel-rule); }

.line.sel.focus { background: var(--focus); }
.line.add { background: var(--add-bg); }
.line.del { background: var(--del-bg); }
.line.hunk { color: var(--muted); }

.line.added .n { box-shadow: inset -4px 0 0 var(--add); }
.line.modified .n { box-shadow: inset -4px 0 0 var(--amber); }
#code-body a.ident { color: inherit; text-decoration: none; }
#code-body a.ident:hover, #code-body a.ident:focus { text-decoration: underline; cursor: pointer; }
/* A marked identifier: its highlight, and its mark drawn above the line, so no column moves. */
a.ident.mark-changed, a.ident.mark-reached { position: relative; border-radius: 2px; }
a.ident.mark-changed { background: var(--del-bg); }
a.ident.mark-reached { background: var(--amber-bg); }
a.ident.mark-changed::after, a.ident.mark-reached::after { position: absolute; top: -0.55em; right: -0.5em; font-weight: 700; }
a.ident.mark-changed::after { content: "*"; color: var(--del); }
a.ident.mark-reached::after { content: "~"; color: var(--amber); }
#uncovered ul { margin: 0; padding-left: 18px; font: 12.5px/1.9 ui-monospace, SFMono-Regular, Menlo, monospace; }
#uncovered a.ident { color: var(--ink); text-decoration: none; }
#uncovered a.ident:hover, #uncovered a.ident:focus { text-decoration: underline; }
#uncovered li .muted { margin-left: 1.2em; }
ul.errors { margin: 0; padding-left: 18px; font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
ul.errors li { white-space: pre-wrap; }
.hljs-keyword, .hljs-literal { color: var(--code-kw); }
.hljs-string { color: var(--code-str); }
.hljs-comment { color: var(--code-cmt); }
.hljs-type, .hljs-built_in { color: var(--code-type); }
.hljs-number { color: var(--code-num); }
.hljs-title { font-weight: 600; }

Specs(dir, specPath string) (portal.Config, error) {\n\t// HOLE(1): open dir with os.OpenRoot and return its FS with specPath; fail with an error naming dir when it cannot be opened\n\treturn portal.Config{Specs: os.DirFS(dir), SpecPath: specPath}, nil\n}\n","diff":"diff --git a/cmd/docportal/main.go b/cmd/docportal/main.go\nnew file mode 100644\nindex 0000000..9649a62\n--- /dev/null\n+++ b/cmd/docportal/main.go\n@@ -0,0 +1,60 @@\n+// Command docportal serves the documentation of an API spec from a local\n+// directory.\n+package main\n+\n+import (\n+\t\"fmt\"\n+\t\"log\"\n+\t\"net/http\"\n+\t\"os\"\n+\n+\t\"github.com/bilus/documentation-portal/portal\"\n+)\n+\n+type config struct {\n+\tAddr     string\n+\tSpecsDir string\n+\tSpecPath string // relative to SpecsDir\n+}\n+\n+func main() {\n+\taddr, h, err := startup(os.Args[1:], os.Getenv)\n+\tif err != nil {\n+\t\tfmt.Fprintln(os.Stderr, \"docportal:\", err)\n+\t\tos.Exit(1)\n+\t}\n+\tlog.Printf(\"listening on %s\", addr)\n+\tlog.Fatal(http.ListenAndServe(addr, h))\n+}\n+\n+// startup reads the configuration, opens the specs directory and builds the\n+// portal. It returns the address to listen on and the portal.\n+func startup(args []string, getenv func(string) string) (string, http.Handler, error) {\n+\tcfg, err := parseConfig(args, getenv)\n+\tif err != nil {\n+\t\treturn \"\", nil, err\n+\t}\n+\tpcfg, err := openSpecs(cfg.SpecsDir, cfg.SpecPath)\n+\tif err != nil {\n+\t\treturn \"\", nil, err\n+\t}\n+\th, err := portal.New(pcfg)\n+\tif err != nil {\n+\t\treturn \"\", nil, err\n+\t}\n+\treturn cfg.Addr, h, nil\n+}\n+\n+// parseConfig reads the configuration from the flags and the environment.\n+// Flags win over the environment, which wins over the defaults.\n+func parseConfig(args []string, getenv func(string) string) (config, error) {\n+\t// HOLE(1): parse -addr, -specs-dir and -spec-path, falling back to DOCPORTAL_ADDR, DOCPORTAL_SPECS_DIR and DOCPORTAL_SPEC_PATH, then to :8080, . and openapi.yaml; reject unk t.Fatalf(\"raw spec: %d %s\", raw.Code, raw.Header().Get(\"Content-Type\"))\n\t}\n\tif raw.Body.String() != string(want) {\n\t\tt.Error(\"raw spec differs from the file\")\n\t}\n}\n\nfunc TestParseConfig(t *testing.T) {\n\tt.Skip(\"HOLE(1): flags win over the environment, which wins over the defaults\")\n\n\tcfg, err := parseConfig(nil, noEnv)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif want := (config{Addr: \":8080\", SpecsDir: \".\", SpecPath: \"openapi.yaml\"}); cfg != want {\n\t\tt.Errorf(\"defaults = %+v, want %+v\", cfg, want)\n\t}\n\n\tenv := map[string]string{\"DOCPORTAL_SPECS_DIR\": \"/srv/specs\", \"DOCPORTAL_SPEC_PATH\": \"api.yaml\"}\n\tcfg, err = parseConfig([]string{\"-spec-path\", \"apis/pets.yaml\"}, func(k string) string { return env[k] })\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif want := (config{Addr: \":8080\", SpecsDir: \"/srv/specs\", SpecPath: \"apis/pets.yaml\"}); cfg != want {\n\t\tt.Errorf(\"got %+v, want %+v\", cfg, want)\n\t}\n\n\tif _, err := parseConfig([]string{\"-spec-path\", \"a.yaml\", \"b.yaml\"}, noEnv); err == nil {\n\t\tt.Error(\"a positional argument was accepted\")\n\t}\n}\n\nfunc TestStartupRejectsMissingSpecsDir(t *testing.T) {\n\tt.Skip(\"HOLE(1): startup names a specs directory it cannot open\")\n\n\t_, _, err := startup([]string{\"-specs-dir\", \"testdata/no-such-dir\"}, noEnv)\n\tif err == nil || !strings.Contains(err.Error(), \"testdata/no-such-dir\") {\n\t\tt.Errorf(\"err = %v, want it to name the directory\", err)\n\t}\n}\n\nfunc TestStartupRejectsSpecPathOutsideDir(t *testing.T) {\n\tt.Skip(\"HOLE(3): startup names a spec path that leaves the specs directory\")\n\n\t_, _, err := startup([]string{\"-specs-dir\", \"../../testdata/specs\", \"-spec-path\", \"../specs/petstore-3.0.yaml\"}, noEnv)\n\tif err == nil || !strings.Contains(err.Error(), \"../specs/petstore-3.0.yaml\") {\n\t\tt.Errorf(\"err = %v, want it to name the spec path\", err)\n\t}\n}\n","diff":"diff --git a/cmd/docportal/main_test.go b/cmd/docpor  environment\n+[1. Read the configuration\n+ from the flags and the environment\n+ (main.parseConfig)]\n+\u003e directory name, spec path\n+[2. Open the specs directory and pair it with the spec path\n+ so that the portal cannot read outside the directory\n+ (main.openSpecs)]\n+    \u003e directory name\n+    \u003c directory handle\n+    \u003cSpecs directory\u003e\n+\u003e portal configuration\n+[3. Build the portal\n+ or refuse a spec path outside the specs directory or missing Elements assets\n+ (portal.New)]\n+\u003e address, portal\n+{HTTP server}\n+\n+# type: arguments = []string\n+# type: environment = func(string) string\n+# type: directory name = string\n+# type: spec path = string\n+# type: portal configuration = portal.Config\n+# type: address = string\n+# type: portal = net/http.Handler\n","beforeLinks":null,"afterLinks":null},"docs/plans/2026-09-29-openapi-elements-viewer.ledger.md":{"before":null,"after":"# Ledger, plan: docs/plans/2026-09-29-openapi-elements-viewer.md\n\n- 2026-09-29 plan drafted for bilus/documentation-portal#2; 6 stages; decisions D1-D8 awaiting approval.\n- 2026-09-29 decision: D1, D3, D4, D5, D7, D8 approved as written.\n- 2026-09-29 decision: D2 changed at review - assets are downloaded by `devbox run make setup` (pinned 9.0.25, SHA-256 checked, git-ignored) instead of committed.\n- 2026-09-29 decision: D6 question answered - chromedp smoke run in the cloud container rendered a page with Chromium 141 via CHROME_BIN=/opt/pw-browsers/chromium and --no-sandbox (root).\n- 2026-09-29 plan amended: assets stage moved to 3 (portal.New checks for assets, outside-in), spec loading to 4, HTTP to 5. Plan approved.\n- 2026-09-29 stage 1 started (skeleton).\n- 2026-09-29 decision: added gnumake to devbox so `devbox run make` does not rely on devbox's implicit stdenv.\n- 2026-09-29 decision: e2e/doc.go (untagged) keeps `go vet ./...` from failing on a package whose only file is behind the e2e tag.\n- 2026-09-29 holes added: HOLE(2)x2, HOLE(3) ments-viewer.md":{"before":null,"after":"# Render API spec bundles with Stoplight Elements\n\nIssue: bilus/documentation-portal#2 (requirement R1, milestone MVP).\nLedger: `docs/plans/2026-09-29-openapi-elements-viewer.ledger.md`.\nDesign: `docs/flow.dfd`, terms in `docs/vocabulary.md`, review page in `docs/review/index.html`.\nBranch: `claude/awesome-curie-he65gq`.\n\n## Requirements\n\nRestated from the issue's acceptance criteria. Requirement 9 is added so the MVP runs before #4 exists.\n\n1. Given a valid API spec, `GET /specs/{spec path}` returns the viewer page, which renders the spec with Stoplight Elements and shows its `info.title`, `info.version` and `info.description`.\n2. Every operation of the spec appears in the Elements navigation. Selecting one shows its method, path, parameters, request body and responses, including their schemas.\n3. Models under `components/schemas` are listed and open on their own.\n4. Internal `$ref`s are resolved, and no raw `$ref` text appears on the page.\n5. Requirements 1 to 4 hold for both sample bundles, OpenAPI 3.0 and OpenAPI 3.1.\n6. An invalid spec gets an error page naming the file and the reason (422), and a missing spec a 404 naming the file. The process keeps serving other requests.\n7. `GET /api/specs/{spec path}` returns the raw spec as `application/yaml`. No request returns any other file of the specs directory.\n8. A headless-browser test over the sample bundles checks the rendered operation list and a schema resolved from a `$ref`.\n9. docportal takes the address, the directory name and the spec path from flags or the environment, and fails at startup, naming the cause, when the specs directory cannot be opened, the spec path leaves it, or the Elements assets are missing.\n\nOut of scope: several specs (#3), Git sources (#4), branches (#6), markdown (#13), authentication (#8, #9), Swagger 2.0, external `$ref`s and CI.\n\n## Questions and assumptions\n\nApproved at the first gate on 2026-09-29, before the switch to this version of the method:\n\n- D1: the portal reads specs from an `io/fs.FS`, a local directory opened with `os.OpenRoot`, not from #4's `Source`. #4 can later hand it an `fs.FS` view of a commit.\n- D2: `devbox run make setup` downloads `@stoplight/elements` 9.0.25, checks the tarball's SHA-256 and extracts the Elements assets (`web-components.min.js`, `styles.min.css` and the Apache-2.0 `LICENSE`), which git ignores and the binary embeds. Their directory follows the code that embeds them, which stage 2 draws.\n- D3: an API spec must parse as YAML and have an `openapi` field of 3.0.x or 3.1.x and a non-empty `info.title`. Swagger 2.0 is rejected with a message saying so.\n- D4: Elements' Try It console is hidden.\n- D5: Elements uses hash routing, so links to operations need no server routes, and `/` redirects to the viewer page.\n- D6: the browser test uses chromedp behind the `e2e` build tag, with `CHROME_BIN`, which the Makefile sets in cloud sessions, and `--no-sandbox` only as root.\n- D7: `portal.New(portal.Config) (http.Handler, error)` is the only public API, pre-1.0.\n- D8: handoffs in chat, commits on the branch above, no pull request per stage.\n\nNew at this gate:\n\n- Open question: the top function is `main.startup`, so the top diagram shows startup, and the portal's request-time I/O (reads through the directory handle, pages sent to the reader) is drawn at no level. The HTTP server calls the portal after startup, so no box's function performs that I/O, and request handling would stay a helper of the routing step that stage 2 draws. The design review recommends drawing it. The way to do that is a top function `run` whose fourth box, \"Serve the portal\", calls `http.ListenAndServe` with the reads from `\u003cSpecs directory\u003e` and the pages to the reader's browser beside it. The cost is a smoke test against a real listener on a fixed port, and a `serve` hole whose mock data is the real body. Assumption for this gate: startup only, as drawn.\n- The address travels on the arrows from step 1 past steps 2 and 3 to the HTTP server, the way dfdreview's own design carries `options`, `design` and `code index` past `draw.Views`. The score cannot see it; the handoff lists it. The design review asked for a store instead, since `portal.New` neither takes nor returns the address; decided against, to follow the method's own example.\n- The flag for the spec path is `-spec-path`, to match `DOCPORTAL_SPEC_PATH`.\n- The skeleton declares the top diagram's functions only. The checks, the Elements assets and the routing come with `docs/flow.3.dfd` in stage 2, so there are no packages under `internal/` yet.\n- The acceptance tests go through `main.startup`, `main.parseConfig` and `portal.New`. The refusal of missing Elements assets cannot be driven from there, because the assets are embedded at build time, so stage 3 tests it at the step that checks them.\n- Requirement 7 used to say that any other path, `..` included, gets a 404. `net/http` answers a path with `..` with a redirect to the cleaned path, so the requirement now states the property that matters: no other file is served.\n- The skeleton's `parseConfig` mock returns the smoke test's configuration, which points at `testdata/specs`. Stage 1 replaces it.\n\n## The change in brief\n\ndocportal gains its startup and a portal for one API spec. Startup reads the configuration from the flags and the environment, opens the specs directory so that the portal cannot read outside it, and builds the portal, refusing a spec path that leaves the specs directory or missing Elements assets. The HTTP server then serves the portal at the address. The viewer page embeds Stoplight Elements, which renders the configured spec in the reader's browser from the raw spec, and an invalid or missing spec gets an error page naming the file.\n\n## Metaphor\n\nStartup is a shop's opening routine. The manager reads the day's orders, unlocks the one stockroom they name and sets up the counter from it. A counter short of anything, such as its instruction booklets, keeps the shop shut. Otherwise the manager hands the counter and the street address to the doorman, who lets readers in.\n\n## Stages\n\nEach stage ends with `devbox run make build lint test test-e2e`, the hole census (`grep -rn \"HOLE(\" --include=*.go --include=Makefile .`), a design review when a diagram changed, the score card, the review page and a halt for review.\n\n### Stage 1: configuration and the specs directory\n\n- Goal: docportal reads its configuration from the flags and the environment, and opens the specs directory so that no read leaves it, refusing a directory it cannot open.\n- Requirement: 9.\n- Dependencies: none.\n- Holes: `1 main.parseConfig`, `1 main.openSpecs`.\n- Acceptance: `TestParseConfig`, `TestStartupRejectsMissingSpecsDir`.\n- Size: 60 lines.\n\n### Stage 2: the steps of building the portal\n\n- Goal: the new level. `docs/flow.3.dfd` draws the steps of `portal.New`, expected to be checking the portal configuration, loading the Elements assets and routing the requests. `portal.New` calls them in order, each declared with a hole of stage 3 or 4.\n- Requirement: 9, 1, 7.\n- Dependencies: 1.\n- Holes: `2 portal.New`.\n- Acceptance: `TestNewServesSpec`, the smoke test of process 3, written in this stage and passing on the new holes' mock data.\n- Size: 100 lines.\n\n### Stage 3: checks and the Elements assets\n\n- Goal: the portal refuses a spec path outside the specs directory and missing Elements assets, and `make setup` fetches the pinned assets and checks them.\n- Requirement: 9, 1.\n- Dependencies: 2.\n- Holes: the checking and asset-loading holes that stage 2 declares.\n- Acceptance: `TestStartupRejectsSpecPathOutsideDir`, and the asset check's own test, written with the fill.\n- Size: 90 lines.\n\n### Stage 4: the viewer page, the raw spec and the Elements assets on the wire\n\n- Goal: a reader opens the viewer page and Stoplight Elements renders the spec, the raw spec and the Elements assets are served, and an invalid or missing spec gets an error naming the file.\n- Requirement: 1 to 8.\n- Dependencies: 3.\n- Holes: the routing hole that stage 2 declares, and the helpers its fill declares: the handlers, loading and checking a spec, and the page templates.\n- Acceptance: `TestIndexRedirects`, `TestViewerPage`, `TestRawSpec`, `TestSpecErrorPages`, `TestElementsAssets`, `TestViewerRendersSampleBundles`.\n- Size: 280 lines, with a README section on setup and running.\n","diff":"diff --git a/docs/plans/2026-09-29-openapi-elements-viewer.md b/docs/plans/2026-09-29-openapi-elements-viewer.md\nnew file mode 100644\nindex 0000000..d583f1c\n--- /dev/null\n+++ b/docs/plans/2026-09-29-openapi-elements-viewer.md\n@@ -0,0 +1,93 @@\n+# Render API spec bundles with Stoplight Elements\n+\n+Issue: bilus/documentation-portal#2 (requirement R1, milestone MVP).\n+Ledger: `docs/plans/2026-09-29-openapi-elements-viewer.ledger.md`.\n+Design: `docs/flow.dfd`, terms in `docs/vocabulary.md`, review page in `docs/review/index.html`.\n+Branch: `claude/awesome-curie-he65gq`.\n+\n+## Requirements\n+\n+Restated from the issue's acceptance criteria. Requirement 9 is added so the MVP runs before #4 exists.\n+\n+1. Given a valid API spec, `GET /specs/{spec path}` returns the viewer page, which renders the spec with Stoplight Elements and shows its `info.title`, `info.version` and `info.description`.\n+2. Every operation of the spec appears in the Elements navigation. Selecting one shows its method, path, parameters, request body and responses, including their schemas.\n+3. Models under `components/schemas` are listed and open on their own.\n+4. Internal `$ref`s are resolved, and no raw `$ref` text appears on the page.\n+5. Requirements 1 to 4 hold for both sample bundles, OpenAPI 3.0 and OpenAPI 3.1.\n+6. An invalid spec gets an error page naming the file and the reason (422), and a missing spec a 404 naming the file. The process keeps serving other requests.\n+7. `GET /api/specs/{spec path}` returns the raw spec as `application/yaml`. No request returns any other file of the specs directory.\n+8. A headless-browser test over the sample bundles checks the rendered operation list and a schema resolved from a `$ref`.\n+9. docportal takes the address, the directory name and the spec path from flags or the environment, and fails at startup, naming the cause, when the specs directory cannot be opened, the spec path leaves it, or the Elements assets are missing.\n+\n+Out of scope: several specs (#3), Git sources (#4), branches (#6), markdown (#13), authentication (#8, #9), Swagger 2.0, external `$ref`s and CI.\n+\n+## Questions and assumptions\n+\n+Approved at the first gate on 2026-09-29, before the switch to this version of the method:\n+\n+- D1: the portal reads specs from an `io/fs.FS`, a local directory opened with `os.OpenRoot`, not from #4's `Source`. #4 can later hand it an `fs.FS` view of a commit.\n+- D2: `devbox run make setup` downloads `@stoplight/elements` 9.0.25, checks the tarball's SHA-256 and extracts the Elements assets (`web-components.min.js`, `styles.min.css` and the Apache-2.0 `LICENSE`), which git ignores and the binary embeds. Their directory follows the code that embeds them, which stage 2 draws.\n+- D3: an API spec must parse as YAML and have an `openapi` field of 3.0.x or 3.1.x and a non-empty `info.title`. Swagger 2.0 is rejected with a message saying so.\n+- D4: Elements' Try It console is hidden.\n+- D5: Elements uses hash routing, so links to operations need no server routes, and `/` redirects to the viewer page.\n+- D6: the browser test uses chromedp behind the `e2e` build tag, with `CHROME_BIN`, which the Makefile sets in cloud sessions, and `--no-sandbox` only as root.\n+- D7: `portal.New(portal.Config) (http.Handler, error)` is the only public API, pre-1.0.\n+- D8: handoffs in chat, commits on the branch above, no pull request per stage.\n+\n+New at this gate:\n+\n+- Open question: the top function is `main.startup`, so the top diagram shows startup, and the portal's request-time I/O (reads through the directory handle, pages sent to the reader) is drawn at no level. The HTTP server calls the portal after startup, so no box's function performs that I/O, and request handling would stay a helper of the routing step that stage 2 draws. The design review recommends drawing it. The way to do that is a top function `run` whose fourth box, \"Serve the portal\", calls `http.ListenAndServe` with the reads from `\u003cSpecs directory\u003e` and the pages to the reader's browser beside it. The cost is a smoke test against a real listener on a fixed port, and a `serve` hole whose mock data is the real body. Assumption for this gate: startup only, as drawn.\n+- The address travels on the arrows from step 1 past steps 2 and 3 to the HTTP server, the way dfdreview's own design carries `options`, `design` and `code index` past `draw.Views`. The score cannot see it; the handoff lists it. The design review asked for a store instead, since `portal.New` neither takes nor returns the address; decided against, to follow the method's own example.\n+- The flag for the spec path is `-spec-path`, to match `DOCPORTAL_SPEC_PATH`.\n+- The skeleton declares the top diagram's functions only. The checks, the Elements assets and the routing come with `docs/flow.3.dfd` in stage 2, so there are no packages under `internal/` yet.\n+- The acceptance tests go through `main.startup`, `main.parseConfig` and `portal.New`. The refusal of missing Elements assets cannot be driven from there, because the assets are embedded at build time, so stage 3 tests it at the step that checks them.\n+- Requirement 7 used to say that any other path, `..` included, gets a 404. `net/http` answers a path with `..` with a redirect to the cleaned path, so the requirement now states the property that matters: no other file is served.\n+- The skeleton's `parseConfig` mock returns the smoke test's configuration, which points at `testdata/specs`. Stage 1 replaces it.\n+\n+## The change in brief\n+\n+docportal gains its startup and a portal for one API spec. Startup reads the configuration from the flags and the environment, opens the specs directory so that the portal cannot read outside it, and builds the portal, refusing a spec path that leaves the specs directory or missing Elements assets. The HTTP server then serves the portal at the address. The viewer page embeds Stoplight Elements, which renders the configured spec in the reader's browser from the raw spec, and an invalid or missing spec gets an error page naming the file.\n+\n+## Metaphor\n+\n+Startup is a shop's opening routine. The manager reads the day's orders, unlocks the one stockroom they name and sets up the counter from it. A counter short of anything, such as its instruction booklets, keeps the shop shut. Otherwise the manager hands the counter and the street address to the doorman, who lets readers in.\n+\n+## Stages\n+\n+Each stage ends with `devbox run make build lint test test-e2e`, the hole census (`grep -rn \"HOLE(\" --include=*.go --include=Makefile .`), a design review when a diagram changed, the score card, the review page and a halt for review.\n+\n+### Stage 1: configuration and the specs directory\n+\n+- Goal: docportal reads its configuration from the flags and the environment, and opens the specs directory so that no read leaves it, refusing a directory it cannot open.\n+- Requirement: 9.\n+- Dependencies: none.\n+- Holes: `1 main.parseConfig`, `1 main.openSpecs`.\n+- Acceptance: `TestParseConfig`, `TestStartupRejectsMissingSpecsDir`.\n+- Size: 60 lines.\n+\n+### Stage 2: the steps of building the portal\n+\n+- Goal: the new level. `docs/flow.3.dfd` draws the steps of `portal.New`, expected to be checking the portal configuration, loading the Elements assets and routing the requests. `portal.New` calls them in order, each declared with a hole of stage 3 or 4.\n+- Requirement: 9, 1, 7.\n+- Dependencies: 1.\n+- Holes: `2 portal.New`.\n+- Acceptance: `TestNewServesSpec`, the smoke test of process 3, written in this stage and passing on the new holes' mock data.\n+- Size: 100 lines.\n+\n+### Stage 3: checks and the Elements assets\n+\n+- Goal: the portal refuses a spec path outside the specs directory and missing Elements assets, and `make setup` fetches the pinned assets and checks them.\n+- Requirement: 9, 1.\n+- Dependencies: 2.\n+- Holes: the checking and asset-loading holes that stage 2 declares.\n+- Acceptance: `TestStartupRejectsSpecPathOutsideDir`, and the asset check's own test, written with the fill.\n+- Size: 90 lines.\n+\n+### Stage 4: the viewer page, the raw spec and the Elements assets on the wire\n+\n+- Goal: a reader opens the viewer page and Stoplight Elements renders the spec, the raw spec and the Elements assets are served, and an invalid or missing spec gets an error naming the file.\n+- Requirement: 1 to 8.\n+- Dependencies: 3.\n+- Holes: the routing hole that stage 2 declares, and the helpers its fill declares: the handlers, loading and checking a spec, and the page templates.\n+- Acceptance: `TestIndexRedirects`, `TestViewerPage`, `TestRawSpec`, `TestSpecErrorPages`, `TestElementsAssets`, `TestViewerRendersSampleBundles`.\n+- Size: 280 lines, with a README section on setup and running.\n","beforeLinks":null,"afterLinks":null},"docs/review/report.txt":{"before":null,"after":"design flow.dfd: 1 diagram, 3 boxes\n\nprivate items\n  none\n\npressure\n  flow.dfd  max 0 in 2 gaps, first between 1 and 2\n\nfindings\n  none\n\ndesign packages\n  flow.dfd, depth 0  main, portal\n\ntotals\n  shared items by level                               none\n  private items                                       0\n  unlabeled arrow                                     0\n  dead item                                           0\n  orphan item                                         0\n  read before write                                   0\n  arrow candidate                                     0\n  unmatched summary                                   0\n  missing summary                                     0\n  summary above home                                  0\n  mixed box                                           0\n  mixed diagram                                       0\n  diagrams with two or more design packages by depth  0: 1\n","diff":"--- /dev/null\n+++ b/docs/review/report.txt\n@@ -0,0 +1,28 @@\n+design flow.dfd: 1 diagram, 3 boxes\n+\n+private items\n+  none\n+\n+pressure\n+  flow.dfd  max 0 in 2 gaps, first between 1 and 2\n+\n+findings\n+  none\n+\n+design packages\n+  flow.dfd, depth 0  main, portal\n+\n+totals\n+  shared items by level                               none\n+  private items                                       0\n+  unlabeled arrow                                     0\n+  dead item                                           0\n+  orphan item                                         0\n+  read before write                                   0\n+  arrow candidate                                     0\n+  unmatched summary                                   0\n+  missing summary                                     0\n+  summary above home                                  0\n+  mixed box                                           0\n+  mixed diagram                                       0\n+  diagrams with two or more design packages by depth  0: 1\n","beforeLinks":null,"afterLinks":null},"docs/review/score.new.tsv":{"before":null,"after":"live_range\tread_distance\ttop_shared\tshared\tpressure\tpackage_spread\tfindings\n0\t0\t0\t0\t0\t0\t0\n","diff":"--- /dev/null\n+++ b/docs/review/score.new.tsv\n@@ -0,0 +1,2 @@\n+live_range\tread_distance\ttop_shared\tshared\tpressure\tpackage_spread\tfindings\n+0\t0\t0\t0\t0\t0\t0\n","beforeLinks":null,"afterLinks":null},"docs/vocabulary.md":{"before":null,"after":"# Vocabulary\n\nTerms of docportal, one per line.\n\n- docportal: the program built from cmd/docportal.\n- API spec: an OpenAPI 3.0 or 3.1 document in YAML with a non-empty info.title, usually a bundle.\n- bundle: an API spec whose $refs all point inside its own file, such as #/components/schemas/Pet.\n- sample bundle: testdata/specs/petstore-3.0.yaml or testdata/specs/petstore-3.1.yaml, the bundles the tests render.\n- operation: one method on one path of an API spec, such as GET /pets/{petId}.\n- model: a schema under components/schemas, as Stoplight Elements lists and opens it.\n- operator: the person who starts docportal and gives it its configuration.\n- reader: the person who reads the documentation in a browser.\n- arguments: docportal's command-line arguments, without the program name: the flags and nothing else.\n- flags: -addr, -specs-dir and -spec-path. Any other flag is rejected.\n- environment: a lookup of environment variables, of which docportal reads DOCPORTAL_ADDR, DOCPORTAL_SPECS_DIR and DOCPORTAL_SPEC_PATH. Tests pass their own lookup.\n- configuration: the address, the directory name and the spec path, each taken from its flag, else from the environment, else from its default: :8080, . and openapi.yaml.\n- startup: reading the configuration, opening the specs directory and building the portal, in main.startup. A failure there stops docportal before it listens.\n- address: the network address docportal listens on, such as :8080.\n- specs directory: the local directory that holds the API specs.\n- directory name: the specs directory's path on the local file system, as the operator gives it.\n- directory handle: the opened specs directory, an fs.FS. Every read of a spec goes through it, so no read leaves the directory.\n- spec path: the path, relative to the specs directory, of the API spec to serve.\n- configured spec: the file at the spec path. The portal serves no other file of the specs directory.\n- missing spec: a spec path with no file behind it. It gets a 404 that names the file.\n- invalid spec: a configured spec that is not an API spec: not YAML, not OpenAPI 3.0 or 3.1, or without a title. It gets an error page naming the file and the reason, and /api/specs/{spec path} answers with an error naming the file, both with status 422.\n- error page: the HTML page the portal shows instead of the viewer page for an invalid or missing spec.\n- portal configuration: the directory handle and the spec path, as portal.New takes them. Tests pass any fs.FS in the handle's place.\n- portal: the HTTP handler that redirects / to the viewer page and serves the viewer page, the raw spec and the Elements assets.\n- HTTP server: net/http's server, which listens on the address and calls the portal for each request.\n- viewer page: the HTML page at /specs/{spec path} that embeds Stoplight Elements pointed at the raw spec.\n- raw spec: the response at /api/specs/{spec path}: the configured spec's content, unchanged, as application/yaml.\n- Stoplight Elements: the web component that renders an API spec as documentation in the reader's browser.\n- Elements assets: the Stoplight Elements script, stylesheet and license, downloaded by `make setup` and embedded in docportal.\n- opening routine: in the metaphor, startup.\n- day's orders: in the metaphor, the configuration.\n- stockroom: in the metaphor, the specs directory.\n- counter: in the metaphor, the portal.\n- doorman: in the metaphor, the HTTP server.\n","diff":"diff --git a/docs/vocabulary.md b/docs/vocabulary.md\nnew file mode 100644\nindex 0000000..1961c23\n--- /dev/null\n+++ b/docs/vocabulary.md\n@@ -0,0 +1,38 @@\n+# Vocabulary\n+\n+Terms of docportal, one per line.\n+\n+- docportal: the program built from cmd/docportal.\n+- API spec: an OpenAPI 3.0 or 3.1 document in YAML with a non-empty info.title, usually a bundle.\n+- bundle: an API spec whose $refs all point inside its own file, such as #/components/schemas/Pet.\n+- sample bundle: testdata/specs/petstore-3.0.yaml or testdata/specs/petstore-3.1.yaml, the bundles the tests render.\n+- operation: one method on one path of an API spec, such as GET /pets/{petId}.\n+- model: a schema under components/schemas, as Stoplight Elements lists and opens it.\n+- operator: the person who starts docportal and gives it its configuration.\n+- reader: the person who reads the documentation in a browser.\n+- arguments: docportal's command-line arguments, without the program name: the flags and nothing else.\n+- flags: -addr, -specs-dir and -spec-path. Any other flag is rejected.\n+- environment: a lookup of environment variables, of which docportal reads DOCPORTAL_ADDR, DOCPORTAL_SPECS_DIR and DOCPORTAL_SPEC_PATH. Tests pass their own lookup.\n+- configuration: the address, the directory name and the spec path, each taken from its flag, else from the environment, else from its default: :8080, . and openapi.yaml.\n+- startup: reading the configuration, opening the specs directory and building the portal, in main.startup. A failure there stops docportal before it listens.\n+- address: the network address docportal listens on, such as :8080.\n+- specs directory: the local directory that holds the API specs.\n+- directory name: the specs directory's path on the local file system, as the operator gives it.\n+- directory handle: the opened specs directory, an fs.FS. Every read of a spec goes through it, so no read leaves the directory.\n+- spec path: the path, relative to the specs directory, of the API spec to serve.\n+- configured spec: the file at the spec path. The portal serves no other file of the specs directory.\n+- missing spec: a spec path with no file behind it. It gets a 404 that names the file.\n+- invalid spec: a configured spec that is not an API spec: not YAML, not OpenAPI 3.0 or 3.1, or without a title. It gets an error page naming the file and the reason, and /api/specs/{spec path} answers with an error naming the file, both with status 422.\n+- error page: the HTML page the portal shows instead of the viewer page for an invalid or missing spec.\n+- portal configuration: the directory handle and the spec path, as portal.New takes them. Tests pass any fs.FS in the handle's place.\n+- portal: the HTTP handler that redirects / to the viewer page and serves the viewer page, the raw spec and the Elements assets.\n+- HTTP server: net/http's server, which listens on the address and calls the portal for each request.\n+- viewer page: the HTML page at /specs/{spec path} that embeds Stoplight Elements pointed at the raw spec.\n+- raw spec: the response at /api/specs/{spec path}: the configured spec's content, unchanged, as application/yaml.\n+- Stoplight Elements: the web component that renders an API spec as documentation in the reader's browser.\n+- Elements assets: the Stoplight Elements script, stylesheet and license, downloaded by `make setup` and embedded in docportal.\n+- opening routine: in the metaphor, startup.\n+- day's orders: in the metaphor, the configuration.\n+- stockroom: in the metaphor, the specs directory.\n+- counter: in the metaphor, the portal.\n+- doorman: in the metaphor, the HTTP server.\n","beforeLinks":null,"afterLinks":null},"e2e/viewer_test.go":{"before":null,"after":"//go:build e2e\n\n// Package e2e drives the portal in a headless browser. Run these tests with\n// `devbox run make test-e2e`.\npackage e2e\n\nimport (\n\t\"context\"\n\t\"net/http/httptest\"\n\t\"os\"\n\t\"slices\"\n\t\"strings\"\n\t\"testing\"\n\t\"time\"\n\n\t\"github.com/chromedp/chromedp\"\n\n\t\"github.com/bilus/documentation-portal/portal\"\n)\n\nfunc TestViewerRendersSampleBundles(t *testing.T) {\n\tt.Skip(\"HOLE(4): the viewer page, the raw spec and the Elements assets are served for real\")\n\n\tbrowser := newBrowser(t)\n\tfor _, tc := range []struct{ file, version, description string }{\n\t\t{\"petstore-3.0.yaml\", \"v1.0.0\", \"written for OpenAPI 3.0\"},\n\t\t{\"petstore-3.1.yaml\", \"v2.0.0\", \"written for OpenAPI 3.1\"},\n\t} {\n\t\tt.Run(tc.file, func(t *testing.T) {\n\t\t\th, err := portal.New(portal.Config{Specs: os.DirFS(\"../testdata/specs\"), SpecPath: tc.file})\n\t\t\tif err != nil {\n\t\t\t\tt.Fatal(err)\n\t\t\t}\n\t\t\tsrv := httptest.NewServer(h)\n\t\t\tdefer srv.Close()\n\t\t\tpage := srv.URL + \"/specs/\" + tc.file\n\n\t\t\toverview := pageText(t, browser, page, \"Show a pet\")\n\t\t\tfor _, want := range []string{\"Petstore\", tc.version, tc.description} {\n\t\t\t\tif !strings.Contains(overview, want) {\n\t\t\t\t\tt.Errorf(\"overview does not show %q\", want)\n\t\t\t\t}\n\t\t\t}\n\t\t\tlines := strings.Split(overview, \"\\n\")\n\t\t\tfor _, want := range []string{\"List pets\", \"Create a pet\", \"Show a pet\", \"NewPet\", \"Pet\", \"Pets\", \"Error\"} {\n\t\t\t\tif !slices.Contains(lines, want) {\n\t\t\t\t\tt.Errorf(\"navigation does not list %q\", want)\n\t\t\t\t}\n\t\t\t}\n\n\t\t\t// Pet reaches the operation only through a $ref, and microchipId is one of its fields.\n\t\t\toperation := pageText(t, browser, page+\"#/operations/showPetById\", \"microchipId\")\n\t\t\tfor _, want := range []string{\"GET\", \"/pets/{petId}\", \"petId\", \"200\"} {\n\t\t\t\tif !strings.Contains(operation, want) {\n\t\t\t\t\tt.Errorf(\"operation does not show %q\", want)\n\t\t\t\t}\n\t\t\t}\n\t\t\tmodel := pageText(t, browser, page+\"#/schemas/Pet\", \"microchipId\")\n\n\t\t\tfor name, text := range map[string]string{\"overview\": overview, \"operation\": operation, \"model\": model} {\n\t\t\t\tif strings.Contains(text, \"$ref\") {\n\t\t\t\t\tt.Errorf(\"%s shows a raw $ref\", name)\n\t\t\t\t}\n\t\t\t}\n\t\t})\n\t}\n}\n\nfunc newBrowser(t *testing.T) context.Context {\n\topts := chromedp.DefaultExecAllocatorOptions[:]\n\tif bin := os.Getenv(\"CHROME_BIN\"); bin != \"\" {\n\t\topts = append(opts, chromedp.ExecPath(bin))\n\t}\n\tif os.Geteuid() == 0 {\n\t\t// Chrome will not start its sandbox as root, as in a cloud container.\n\t\topts = append(opts, chromedp.NoSandbox)\n\t}\n\tactx, cancel := chromedp.NewExecAllocator(context.Background(), opts...)\n\tt.Cleanup(cancel)\n\tctx, cancel := chromedp.NewCo /portal_test.go","status":"added"},{"path":"testdata/specs/petstore-3.0.yaml","status":"added"},{"path":"testdata/specs/petstore-3.1.yaml","status":"added"}],"brief":"docportal gains its startup and a portal for one API spec. Startup reads the configuration from the flags and the environment, opens the specs directory so that the portal cannot read outside it, and builds the portal, refusing a spec path that leaves the specs directory or missing Elements assets. The HTTP server then serves the portal at the address. The viewer page embeds Stoplight Elements, which renders the configured spec in the reader's browser from the raw spec, and an invalid or missing spec gets an error page naming the file.","metaphor":"Startup is a shop's opening routine. The manager reads the day's orders, unlocks the one stockroom they name and sets up the counter from it. A counter short of anything, such as its instruction booklets, keeps the shop shut. Otherwise the manager hands the counter and the street address to the doorman, who lets readers in.","oldScore":null,"newScore":{"columns":["live_range","read_distance","top_shared","shared","pressure","package_spread","findings"],"values":["0","0","0","0","0","0","0"]},"report":"design flow.dfd: 1 diagram, 3 boxes\n\nprivate items\n  none\n\npressure\n  flow.dfd  max 0 in 2 gaps, first between 1 and 2\n\nfindings\n  none\n\ndesign packages\n  flow.dfd, depth 0  main, portal\n\ntotals\n  shared items by level                               none\n  private items                                       0\n  unlabeled arrow                                     0\n  dead item                                           0\n  orphan item                                         0\n  read before write                                   0\n  arrow candidate                                     0\n  unmatched summary                                   0\n  missing summary                                     0\n  summary above home <script>
(function () {
  "use strict";
  const data = JSON.parse(document.getElementById("data").textContent);
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const other = (version) => (version === "before" ? "after" : "before");
  const viewNames = { before: "Before", diff: "Diff", after: "After" };
  // line and end select lines of the open file: a definition's line, or a declaration's lines.
  const state = { diagram: 0, view: {}, file: null, key: null, line: null, end: null, fileView: "after" };
  const emptyCode = $("code-body").innerHTML;
  const emptyStatus = $("code-status").innerHTML;
  const refsLink = $("refs-link");
  const refs = $("refs");
  const implsLink = $("impls-link");
  const impls = $("impls");

  $("title").textContent = data.title;
  $("subtitle").textContent = data.base
    ? "Before is " + data.base.slice(0, 12) + ", and After is the working tree."
    : "The working tree alone, with no base to compare against.";

  function tabs(container, items, selected, onSelect) {
    container.innerHTML = "";
    items.forEach((item) => {
      const b = document.createElement("button");
      b.type = "button";
      b.setAttribute("role", "tab");
      b.setAttribute("aria-selected", String(item.id === selected));
      b.textContent = item.label;
      if (item.hint) {
        b.title = item.hint;
      }
      if (item.mark) {
        const star = document.createElement("span");
        star.className = "mark " + item.mark;
        star.textContent = marks[item.mark].glyph;
        star.title = item.markTip;
        b.appendChild(star);
      }
      b.addEventListener("click", () => onSelect(item.id));
      container.appendChild(b);
    });
  }

  // The diagrams, each in its views.
  let marked = null; // for each diagram, the strongest mark of the declarations its drawings link

  function selectDiagram(i) {
    state.diagram = i;
    marked = marked || data.diagrams.map(tabMark);
    // A tab shows the diagram's number. Its title, the description of the expanded
    // process, shows on hover and above the drawing.
    tabs($("tabs"), data.diagrams.map((d, k) => ({
      id: k, label: d.number || "Overview", hint: d.number ? d.title : "",
      mark: marked[k],
      markTip: (marked[k] === "changed" ? "shows a declaration changed since " : "shows a function whose calls reach a change since ") + data.base,
    })), i, (k) => navigate(() => selectDiagram(k)));
    const d = data.diagrams[i];
    $("diagram-title").textContent = d.title;
    const present = ["before", "diff", "after"].filter((v) => d[v]);
    showView(present.includes(state.view[i]) ? state.view[i] : defaultView(d));
    uncoveredList(d);
  }

  // uncoveredList lists, under the Overview drawing, the changed declarations and methods that
  // no drawing covers, each with its mark and a link to its declaration.
  function uncoveredList(d) {
    const box = $("uncovered");
    box.innerHTML = "";
    if (d.number !== "" || !(data.uncovered || []).length) {
      return;
    }
    const h = document.createElement("h2");
    h.textContent = "Changes outside the drawings";
    const p = document.createElement("p");
    p.className = "muted";
    p.textContent = "No drawing links these declarations, and no linked function reaches them through its calls.";
    const ul = document.createElement("ul");
    data.uncovered.forEach((u) => {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.href = "#";
      a.className = "ident mark-" + u.mark;
      a.textContent = u.key;
      a.title = marks[u.mark].tip + data.base;
      a.addEventListener("click", (e) => {
        e.preventDefault();
        navigate(() => showDecl(u.key, u.version));
      });
      const where = document.createElement("span");
      where.className = "muted";
      where.textContent = u.file + ":" + u.line + (u.version === "before" ? " (Before)" : "");
      li.append(a, where);
      ul.appendChild(li);
    });
    box.append(h, p, ul);
  }

  // defaultView returns the view a diagram opens in: Diff when it changed, else its one view.
  function defaultView(d) {
    const present = ["before", "diff", "after"].filter((v) => d[v]);
    return present.includes("diff") ? "diff" : present[present.length - 1];
  }

  function showView(view) {
    const d = data.diagrams[state.diagram];
    state.view[state.diagram] = view;
    const present = ["before", "diff", "after"].filter((v) => d[v]);
    tabs($("views"), present.length > 1 ? present.map((v) => ({ id: v, label: viewNames[v] })) : [], view, (v) => {
      showView(v);
      record(false);
    });
    $("drawing").innerHTML = d[view] || "";
    const svg = $("drawing").querySelector("svg");
    if (svg) {
      decorate(svg, view);
    }
  }

  // The Before view reads the base; the Diff and After views read the working tree.
  const versionOf = (view) => (view === "before" ? "before" : "after");

  function decorate(svg, view) {
    const version = versionOf(view);
    svg.querySelectorAll("a[href]").forEach((a) => {
      const href = a.getAttribute("href");
      if (href.startsWith("#term/")) {
        const term = decodeURIComponent(href.slice(6));
        const def = (data.terms[version] || {})[term] || (data.terms[other(version)] || {})[term];
        if (def) {
          const t = document.createElementNS("http://www.w3.org/2000/svg", "title");
          t.textContent = term + ": " + def;
          a.appendChild(t);
        }
      } else if (href.startsWith("#code/")) {
        const decl = data.decls[href.slice(6)];
        if (!decl || (!decl.before && !decl.after)) {
          a.classList.add("missing");
        } else if (markOf(decl)) {
          markLink(a, markOf(decl));
        }
      } else if (href.startsWith("#type/")) {
        const decl = data.decls[typeKey(typeOf(data.diagrams[state.diagram], decodeURIComponent(href.slice(6)), version))];
        if (markOf(decl)) {
          markLink(a, markOf(decl));
        }
      } else if (/^https?:/.test(href)) {
        a.setAttribute("target", "_blank");
        a.setAttribute("rel", "noopener");
      }
    });
    const here = data.diagrams[state.diagram].number;
    svg.querySelectorAll("text").forEach((t) => {
      const n = t.textContent.trim();
      const child = data.diagrams.findIndex((d) => d.number !== "" && d.number === n && parentOf(d.number) === here);
      if (child >= 0 && !t.closest("a")) {
        t.classList.add("child");
        t.setAttribute("tabindex", "0");
        t.setAttribute("role", "link");
        t.addEventListener("click", () => navigate(() => selectDiagram(child)));
        t.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            navigate(() => selectDiagram(child));
          }
        });
      }
    });
    svg.addEventListener("click", (e) => {
      const a = e.target.closest("a[href]");
      if (!a) {
        return;
      }
      const href = a.getAttribute("href");
      if (href.startsWith("#code/")) {
        e.preventDefault();
        navigate(() => showDecl(href.slice(6), version));
      } else if (href.startsWith("#type/")) {
        e.preventDefault();
        navigate(() => showType(decodeURIComponent(href.slice(6)), version));
      } else if (href.startsWith("#")) {
        e.preventDefault();
      }
    });
  }

  // The two marks of a changed declaration: a change in its own text, or in its reach only.
  const marks = {
    changed: { glyph: "*", tip: "changed since " },
    reached: { glyph: "~", tip: "calls a function or method changed since " },
  };

  // markOf returns a declaration's mark: "changed", "reached" or "".
  const markOf = (decl) => (!decl || !decl.changed ? "" : decl.reached ? "reached" : "changed");

  // tabMark returns the strongest mark among the declarations that a diagram's drawings link.
  function tabMark(d) {
    let best = "";
    ["before", "diff", "after"].forEach((view) => {
      for (const m of (d[view] || "").matchAll(/href="#(code|type)\/([^"]*)"/g)) {
        const key = m[1] === "code" ? m[2] : typeKey(typeOf(d, decodeURIComponent(m[2]), versionOf(view)));
        const kind = markOf(data.decls[key]);
        if (kind === "changed" || (kind === "reached" && !best)) {
          best = kind;
        }
      }
    });
    // The Overview also shows the changes outside the drawings.
    if (d.number === "") {
      (data.uncovered || []).forEach((u) => {
        if (u.mark === "changed" || (u.mark === "reached" && !best)) {
          best = u.mark;
        }
      });
    }
    return best;
  }

  // markLink puts a highlight behind a link of a changed declaration and its mark after it.
  function markLink(a, kind) {
    const svg = "http://www.w3.org/2000/svg";
    const name = a.querySelector("tspan");
    const text = a.closest("text");
    if (name && text) {
      const box = name.getBBox();
      const rect = document.createElementNS(svg, "rect");
      Object.entries({ x: box.x - 1, y: box.y, width: box.width + 2, height: box.height, rx: 2 }).forEach(([k, v]) => rect.setAttribute(k, v));
      rect.setAttribute("class", "hl " + kind);
      text.before(rect);
    }
    const star = document.createElementNS(svg, "tspan");
    star.classList.add(kind);
    star.textContent = marks[kind].glyph;
    const t = document.createElementNS(svg, "title");
    t.textContent = marks[kind].tip + data.base;
    a.append(star, t);
  }

  function parentOf(number) {
    const i = number.lastIndexOf(".");
    return i < 0 ? "" : number.slice(0, i);
  }

  // The code panel. status shows a message above the code and hides the "Show references"
  // and "Show implementations" links, which renderFile shows again for a declaration or a
  // method, and for an interface.
  function status(html) {
    $("code-status").innerHTML = html;
    refsLink.hidden = true;
    implsLink.hidden = true;
    closeRefs();
    closeImpls();
  }

  function placeOf(key, version) {
    return (data.decls[key] || {})[version] || null;
  }

  function showDecl(key, version) {
    const place = placeOf(key, version) || placeOf(key, other(version));
    if (!place) {
      status(esc(key) + " has no declaration in either version.");
      return false;
    }
    openFile(place.file, placeOf(key, version) ? version : other(version), key);
    return true;
  }

  // typeOf returns a flow item's type in diagram d, from the other version when this one lacks it.
  function typeOf(d, item, version) {
    return (d.types[version] || {})[item] || (d.types[other(version)] || {})[item] || "";
  }

  // typeKey returns the declaration key of a type's first qualified name, such as lib.Item in []*lib.Item.
  function typeKey(type) {
    const m = /\b([a-z][a-z0-9_]*)\.([A-Za-z_][A-Za-z0-9_]*)/.exec(type);
    return m ? m[1] + "." + m[2] : "";
  }

  function showType(item, version) {
    const type = typeOf(data.diagrams[state.diagram], item, version);
    if (!type) {
      status(esc(item) + " has no type comment.");
      return;
    }
    const key = typeKey(type);
    if (!key || !showDecl(key, version)) {
      status(esc(item) + ": " + esc(type));
      return;
    }
    $("code-status").innerHTML = esc(item) + ": " + esc(type) + "<br>" + $("code-status").innerHTML;
  }

  function openFile(path, view, key) {
    state.file = path;
    state.key = key || null;
    state.line = null;
    state.end = null;
    state.fileView = view;
    renderFile();
  }

  // changedLines returns the status of each changed line of a file's After version, by line
  // number, from the file's unified diff: "modified" for a line that replaces removed lines,
  // and "added" for any other added line.
  function changedLines(diff) {
    const status = {};
    let line = 0; // the After version's number of the next line, 0 before the first hunk
    let removed = 0;
    let added = [];
    const flush = () => {
      added.forEach((n) => {
        status[n] = removed > 0 ? "modified" : "added";
      });
      removed = 0;
      added = [];
    };
    (diff || "").split("\n").forEach((ln) => {
      const hunk = /^@@ -\d+(?:,\d+)? \+(\d+)/.exec(ln);
      if (hunk) {
        flush();
        line = Number(hunk[1]);
      } else if (line === 0 || ln.startsWith("\\")) {
        // The file's header, or a note such as "\ No newline at end of file".
      } else if (ln.startsWith("+")) {
        added.push(line++);
      } else if (ln.startsWith("-")) {
        removed++;
      } else {
        flush();
        line++;
      }
    });
    flush();
    return status;
  }

  // The identifier links of the open file's view, by line; renderFile fills it.
  let lineLinks = {};

  // linkLine wraps each identifier of line n of the open file, in its highlighted html,
  // in a link to the identifier's definition in the same version.
  function linkLine(html, n, version) {
    const links = lineLinks[n];
    if (!links) {
      return html;
    }
    const t = document.createElement("template");
    t.innerHTML = html;
    const texts = [];
    let offset = 0; // UTF-16 code units before each text node
    const walker = document.createTreeWalker(t.content, NodeFilter.SHOW_TEXT);
    for (let node = walker.nextNode(); node; node = walker.nextNode()) {
      texts.push({ node, start: offset });
      offset += node.data.length;
    }
    // From the last identifier back, so a split leaves the earlier offsets of its node valid.
    [...links].sort((a, b) => b.c - a.c).forEach((link) => {
      const from = link.c - 1;
      const text = texts.find((x) => from >= x.start && from + link.n <= x.start + x.node.data.length);
      if (!text) {
        return;
      }
      const name = text.node.splitText(from - text.start);
      name.splitText(link.n);
      const a = document.createElement("a");
      a.className = link.m ? "ident mark-" + link.m : "ident";
      if (link.m) {
        a.title = marks[link.m].tip + data.base;
      }
      if (link.u) {
        a.href = link.u;
        a.target = "_blank";
        a.rel = "noopener";
      } else {
        a.href = "#";
        if (link.k) {
          a.dataset.key = link.k;
        }
        a.dataset.file = link.f;
        a.dataset.line = link.t;
        if (link.e) {
          a.dataset.end = link.e;
        }
        a.dataset.version = version;
      }
      name.replaceWith(a);
      a.appendChild(name);
    });
    return t.innerHTML;
  }

  // openDefinition opens a link's definition: its file in the same version at its line, with
  // the key of its declaration or method, or its URL. The link of a declaration's name
  // selects the declaration's lines instead.
  function openDefinition(link, version) {
    if (link.u) {
      window.open(link.u, "_blank", "noopener");
      return;
    }
    state.file = link.f;
    state.key = link.k || null;
    state.line = link.t;
    state.end = link.e || null;
    state.fileView = version;
    renderFile();
  }

  function renderFile() {
    const f = data.files[state.file];
    if (!f) {
      status(esc(state.file) + " is not on the page.");
      $("code-views").innerHTML = "";
      $("code-body").innerHTML = "";
      return;
    }
    const present = ["before", "diff", "after"].filter((v) => (v === "diff" ? f.diff : f[v] !== null));
    if (!present.includes(state.fileView)) {
      state.fileView = present[present.length - 1];
    }
    tabs($("code-views"), present.length > 1 ? present.map((v) => ({ id: v, label: viewNames[v] })) : [], state.fileView, (v) => {
      state.fileView = v;
      renderFile();
      record(false);
    });
    // The selection: a declaration's lines, from the link of its name or from its key, and
    // inside them the line that a link opened, such as a definition or a reference, as the
    // focus. Without a declaration that holds it, that line stands alone.
    let where = null;
    let focus = null;
    if (state.fileView !== "diff") {
      const decl = state.key ? placeOf(state.key, state.fileView) : null;
      const holds = decl && decl.file === state.file && (!state.line || (state.line >= decl.start && state.line <= decl.end));
      if (state.end) {
        where = { start: state.line, end: state.end };
      } else if (holds) {
        where = decl;
        focus = state.line;
      } else if (state.line) {
        where = { start: state.line, end: state.line };
      }
    }
    const at = focus || (where && where.start);
    let label = esc(state.file) + (state.line ? ":" + state.line : "") + " (" + viewNames[state.fileView] + ")";
    if (state.key) {
      label = esc(state.key) + " in " + esc(state.file) + (at ? ":" + at : "") + " (" + viewNames[state.fileView] + ")";
    }
    status(label);
    refsLink.hidden = !state.key;
    implsLink.hidden = !implementationsOf(state.key);
    const out = [];
    if (state.fileView === "diff") {
      f.diff.replace(/\n$/, "").split("\n").forEach((ln, i) => {
        let cls = "";
        if (ln.startsWith("@@")) {
          cls = " hunk";
        } else if (ln.startsWith("+") && !ln.startsWith("+++")) {
          cls = " add";
        } else if (ln.startsWith("-") && !ln.startsWith("---")) {
          cls = " del";
        }
        out.push('<div class="line' + cls + '"><span class="n">' + (i + 1) + '</span><span class="s">' + esc(ln) + "</span></div>");
      });
    } else {
      const go = state.file.endsWith(".go") && window.hljs;
      const changed = state.fileView === "after" ? changedLines(f.diff) : {};
      lineLinks = {};
      (f[state.fileView + "Links"] || []).forEach((l) => {
        (lineLinks[l.l] = lineLinks[l.l] || []).push(l);
      });
      f[state.fileView].replace(/\n$/, "").split("\n").forEach((ln, i) => {
        const n = i + 1;
        const sel = (where && n >= where.start && n <= where.end ? " sel" : "") + (n === focus ? " focus" : "") +
          (changed[n] ? " " + changed[n] : "");
        const src = linkLine(go ? hljs.highlight(ln, { language: "go", ignoreIllegals: true }).value : esc(ln), n, state.fileView);
        out.push('<div class="line' + sel + '" id="L' + n + '"><span class="n">' + n + '</span><span class="s">' + src + "</span></div>");
      });
    }
    $("code-body").innerHTML = out.join("");
    // The panel scrolls to the selection's first line, or to the focus when that line would
    // leave the focus out of view.
    const first = where && document.getElementById("L" + where.start);
    const marked = focus && document.getElementById("L" + focus);
    const room = $("code").clientHeight - $("code-head").offsetHeight - 36;
    const target = first && marked && marked.offsetTop - first.offsetTop > room ? marked : first;
    $("code").scrollTop = target ? target.offsetTop - $("code-head").offsetHeight - 12 : 0;
  }

  // packageErrors lists the package errors of both versions.
  function packageErrors() {
    const ul = document.createElement("ul");
    ul.className = "errors";
    data.errors.forEach((e) => {
      const li = document.createElement("li");
      li.textContent = e;
      ul.appendChild(li);
    });
    return ul;
  }

  // The notes under the drawings.
  function section(title, content) {
    const h = document.createElement("h2");
    h.textContent = title;
    $("notes").appendChild(h);
    $("notes").appendChild(content);
  }

  function prose(text) {
    const div = document.createElement("div");
    div.className = "prose";
    text.split(/\n\s*\n/).forEach((para) => {
      const p = document.createElement("p");
      p.textContent = para.replace(/\n/g, " ");
      div.appendChild(p);
    });
    return div;
  }

  function scoreTable() {
    const old = data.oldScore;
    const rows = ["<tr><th>Column</th><th>Cached</th><th>New</th><th>Change</th></tr>"];
    data.newScore.columns.forEach((col, i) => {
      const now = Number(data.newScore.values[i]);
      const k = old ? old.columns.indexOf(col) : -1;
      const before = k >= 0 ? Number(old.values[k]) : null;
      let change = "";
      if (before !== null && !Number.isNaN(now) && !Number.isNaN(before)) {
        const d = now - before;
        change = d > 0 ? '<span class="rise">+' + d + " rise</span>" : d < 0 ? '<span class="fall">' + d + "</span>" : "0";
      }
      rows.push("<tr><td>" + esc(col) + '</td><td class="num">' + (before === null ? "" : before) + '</td><td class="num">' +
        esc(data.newScore.values[i]) + '</td><td class="num">' + change + "</td></tr>");
    });
    const t = document.createElement("table");
    t.innerHTML = rows.join("");
    return t;
  }

  function vocabularyChanges() {
    const before = data.terms.before || {};
    const after = data.terms.after || {};
    const names = Array.from(new Set(Object.keys(before).concat(Object.keys(after)))).sort();
    const rows = [];
    names.forEach((term) => {
      let kind = "";
      if (!(term in before)) {
        kind = "added";
      } else if (!(term in after)) {
        kind = "removed";
      } else if (before[term] !== after[term]) {
        kind = "changed";
      }
      if (kind) {
        rows.push('<tr><td class="' + kind + '">' + kind + "</td><td>" + esc(term) + "</td><td>" + esc(after[term] || before[term]) + "</td></tr>");
      }
    });
    const t = document.createElement("table");
    t.innerHTML = rows.length ? rows.join("") : '<tr><td class="muted">No changes.</td></tr>';
    return t;
  }

  function changedFiles() {
    const ul = document.createElement("ul");
    ul.className = "files";
    (data.changed || []).forEach((c) => {
      const li = document.createElement("li");
      const s = document.createElement("span");
      s.className = "status " + ({ added: "added", deleted: "removed" }[c.status] || "changed");
      s.textContent = c.status;
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = c.path;
      b.addEventListener("click", () => navigate(() => openFile(c.path, "diff", null)));
      li.appendChild(s);
      li.appendChild(b);
      ul.appendChild(li);
    });
    if (!ul.children.length) {
      ul.innerHTML = '<li class="muted">No changes.</li>';
    }
    return ul;
  }

  if (data.brief) {
    section("The change in brief", prose(data.brief));
  }
  if (data.metaphor) {
    section("Metaphor", prose(data.metaphor));
  }
  if (data.newScore) {
    section("Score", scoreTable());
  }
  if (data.base) {
    section("Vocabulary changes", vocabularyChanges());
    section("Changed files", changedFiles());
  }
  if (data.report) {
    const pre = document.createElement("pre");
    pre.className = "report";
    pre.textContent = data.report;
    section("dfdmetrics report", pre);
  }
  if (data.errors && data.errors.length) {
    section("Package errors", packageErrors());
  }
  $("code-body").addEventListener("click", (e) => {
    const a = e.target.closest("a.ident");
    if (a && a.dataset.file) {
      e.preventDefault();
      navigate(() => openDefinition({ f: a.dataset.file, t: Number(a.dataset.line), e: Number(a.dataset.end), k: a.dataset.key }, a.dataset.version));
    }
  });

  // The search box lists the declarations and methods whose keys match its text, and opens
  // the chosen one in the code panel.
  const search = $("search");
  const results = $("search-results");
  const shown = 50; // the most results that the list shows
  let found = []; // the keys that match the text, best first
  let active = -1; // the index of the highlighted result, -1 for none

  // matching returns the keys of the declarations and methods that match query, best first:
  // those named query, then those whose names start with it, then those whose keys hold it.
  function matching(query) {
    const q = query.trim().toLowerCase();
    if (!q) {
      return [];
    }
    const scored = [];
    Object.keys(data.decls).forEach((key) => {
      const k = key.toLowerCase();
      const name = k.slice(k.lastIndexOf(".") + 1);
      const score = name === q ? 0 : name.startsWith(q) ? 1 : k.includes(q) ? 2 : -1;
      if (score >= 0) {
        scored.push({ key, score });
      }
    });
    scored.sort((a, b) => a.score - b.score || (a.key < b.key ? -1 : a.key > b.key ? 1 : 0));
    return scored.map((s) => s.key);
  }

  function showResults() {
    found = matching(search.value);
    results.replaceChildren();
    found.slice(0, shown).forEach((key, i) => {
      const decl = data.decls[key];
      const version = decl.after ? "after" : "before";
      const where = decl[version];
      const li = document.createElement("li");
      li.id = "result-" + i;
      li.setAttribute("role", "option");
      li.dataset.key = key;
      li.dataset.index = i;
      const kind = document.createElement("span");
      kind.className = "kind";
      kind.textContent = where.kind;
      const name = document.createElement("span");
      name.textContent = key;
      li.append(kind, name);
      const m = markOf(decl);
      if (m) {
        const star = document.createElement("span");
        star.className = "mark " + m;
        star.textContent = marks[m].glyph;
        star.title = marks[m].tip + data.base;
        li.append(star);
      }
      const place = document.createElement("span");
      place.className = "where";
      place.textContent = where.file + ":" + where.start + (version === "before" ? " (Before)" : "");
      li.append(place);
      results.appendChild(li);
    });
    const typed = search.value.trim() !== "";
    const note = found.length > shown ? found.length - shown + " more; type more of the name to narrow the list."
      : typed && !found.length ? "No declaration or method matches." : "";
    if (note) {
      const li = document.createElement("li");
      li.className = "note";
      li.textContent = note;
      results.appendChild(li);
    }
    results.hidden = !typed;
    search.setAttribute("aria-expanded", String(typed));
    setActive(found.length ? 0 : -1);
  }

  function setActive(i) {
    active = i;
    results.querySelectorAll("li[data-key]").forEach((li) => {
      const on = Number(li.dataset.index) === i;
      li.classList.toggle("active", on);
      li.setAttribute("aria-selected", String(on));
      if (on) {
        li.scrollIntoView({ block: "nearest" });
      }
    });
    if (i >= 0) {
      search.setAttribute("aria-activedescendant", "result-" + i);
    } else {
      search.removeAttribute("aria-activedescendant");
    }
  }

  function closeResults() {
    results.hidden = true;
    search.setAttribute("aria-expanded", "false");
  }

  // choose opens a declaration or method in the version of the open file.
  function choose(key) {
    closeResults();
    navigate(() => showDecl(key, state.fileView === "before" ? "before" : "after"));
  }

  search.addEventListener("input", showResults);
  search.addEventListener("focus", () => {
    if (search.value.trim()) {
      showResults();
    }
  });
  search.addEventListener("blur", closeResults);
  search.addEventListener("keydown", (e) => {
    const n = Math.min(found.length, shown);
    if ((e.key === "ArrowDown" || e.key === "ArrowUp") && n) {
      e.preventDefault();
      if (results.hidden) {
        showResults();
      } else {
        setActive((active + (e.key === "ArrowDown" ? 1 : n - 1)) % n);
      }
    } else if (e.key === "Enter" && !results.hidden && active >= 0) {
      e.preventDefault();
      choose(found[active]);
    } else if (e.key === "Escape" && !results.hidden) {
      e.preventDefault();
      closeResults();
    }
  });
  // A press on the list keeps the focus in the box, so the list stays open until the click.
  results.addEventListener("mousedown", (e) => e.preventDefault());
  results.addEventListener("mousemove", (e) => {
    const li = e.target.closest("li[data-key]");
    if (li && Number(li.dataset.index) !== active) {
      setActive(Number(li.dataset.index));
    }
  });
  results.addEventListener("click", (e) => {
    const li = e.target.closest("li[data-key]");
    if (li) {
      choose(li.dataset.key);
    }
  });

  // The "Show references" link lists the uses of the open declaration or method in the open
  // version, one line for each declaration or method that holds some, with their lines.
  function openRefs() {
    closeImpls();
    const version = state.fileView === "before" ? "before" : "after";
    const list = ((data.uses || {})[version] || {})[state.key] || [];
    const groups = new Map();
    list.forEach((u) => {
      const id = (u.i || "") + " " + u.f;
      if (!groups.has(id)) {
        groups.set(id, { key: u.i || "", file: u.f, lines: [] });
      }
      groups.get(id).lines.push(u.l);
    });
    const head = document.createElement("p");
    head.textContent = (list.length ? "References to " : "No references to ") + state.key + " in the " + viewNames[version] +
      " version" + (list.length ? ":" : ".");
    refs.replaceChildren(head);
    if (list.length) {
      const ul = document.createElement("ul");
      groups.forEach((g) => {
        const li = document.createElement("li");
        const where = document.createElement("span");
        where.className = "where";
        where.append(g.file + ":");
        g.lines.forEach((line, i) => {
          if (i) {
            where.append(", ");
          }
          where.append(refLink(String(line), g, line, version));
        });
        li.append(refLink(g.key || g.file, g, g.lines[0], version), where);
        ul.appendChild(li);
      });
      refs.appendChild(ul);
    }
    refs.hidden = false;
    refsLink.textContent = "Hide references";
    refsLink.setAttribute("aria-expanded", "true");
  }

  // refLink returns a link to a line of a group's file, which opens with the group's key.
  function refLink(text, group, line, version) {
    const a = document.createElement("a");
    a.href = "#";
    a.textContent = text;
    if (group.key) {
      a.dataset.key = group.key;
    }
    a.dataset.file = group.file;
    a.dataset.line = line;
    a.dataset.version = version;
    return a;
  }

  function closeRefs() {
    refs.hidden = true;
    refs.replaceChildren();
    refsLink.textContent = "Show references";
    refsLink.setAttribute("aria-expanded", "false");
  }

  // implementationsOf returns the types that implement an interface in the open version, or
  // null for a key of anything else.
  function implementationsOf(key) {
    const all = (data.implementations || {})[state.fileView === "before" ? "before" : "after"] || {};
    return key && Object.prototype.hasOwnProperty.call(all, key) ? all[key] : null;
  }

  // The "Show implementations" link lists the types that implement the open interface in the
  // open version, a type marked with "*" when only its pointer implements it.
  function openImpls() {
    closeRefs();
    const version = state.fileView === "before" ? "before" : "after";
    const list = implementationsOf(state.key) || [];
    const head = document.createElement("p");
    head.textContent = (list.length ? "Implementations of " : "No implementations of ") + state.key + " in the " +
      viewNames[version] + " version" + (list.length ? ":" : ".");
    impls.replaceChildren(head);
    if (list.length) {
      const ul = document.createElement("ul");
      list.forEach((m) => {
        const li = document.createElement("li");
        const where = document.createElement("span");
        where.className = "where";
        where.textContent = m.f + ":" + m.l;
        li.append(refLink((m.p ? "*" : "") + m.k, { key: m.k, file: m.f }, m.l, version), where);
        ul.appendChild(li);
      });
      impls.appendChild(ul);
    }
    impls.hidden = false;
    implsLink.textContent = "Hide implementations";
    implsLink.setAttribute("aria-expanded", "true");
  }

  function closeImpls() {
    impls.hidden = true;
    impls.replaceChildren();
    implsLink.textContent = "Show implementations";
    implsLink.setAttribute("aria-expanded", "false");
  }

  refsLink.addEventListener("click", () => (refs.hidden ? openRefs() : closeRefs()));
  implsLink.addEventListener("click", () => (impls.hidden ? openImpls() : closeImpls()));
  [refs, impls].forEach((list) => list.addEventListener("click", (e) => {
    const a = e.target.closest("a[data-file]");
    if (a) {
      e.preventDefault();
      navigate(() => openDefinition({ f: a.dataset.file, t: Number(a.dataset.line), k: a.dataset.key }, a.dataset.version));
    }
  }));
  // A click elsewhere, or Escape, closes the lists.
  document.addEventListener("click", (e) => {
    if (!e.target.closest("#refs, #refs-link, #impls, #impls-link")) {
      closeRefs();
      closeImpls();
    }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      closeRefs();
      closeImpls();
    }
  });

  // The history: each navigation adds an entry, and a switch of view updates the current one,
  // so the Back button returns to the previous place. An entry's URL hash names its place, as
  // in #d=3.3&v=diff&f=cart/cart.go&fv=after&l=21, and a hash such as #code/analyze.sumTypes
  // opens that declaration.
  const place = () => ({
    diagram: state.diagram, view: { ...state.view },
    file: state.file, key: state.key, line: state.line, end: state.end, fileView: state.fileView,
  });

  function hashOf(p) {
    const parts = [];
    const add = (name, value) => {
      if (value) {
        parts.push(name + "=" + encodeURIComponent(value).replace(/%2F/g, "/"));
      }
    };
    const d = data.diagrams[p.diagram] || {};
    add("d", d.number);
    if (p.view[p.diagram] !== defaultView(d)) {
      add("v", p.view[p.diagram]);
    }
    if (p.file) {
      add("f", p.file);
      add("fv", p.fileView);
      add("k", p.key);
      add("l", p.line ? String(p.line) : "");
      add("e", p.end ? String(p.end) : "");
    }
    return parts.length ? "#" + parts.join("&") : "";
  }

  // placeOfHash reads a place from a hash that hashOf wrote.
  function placeOfHash(hash) {
    const q = new URLSearchParams(hash.slice(1));
    const diagram = Math.max(0, data.diagrams.findIndex((d) => d.number === (q.get("d") || "")));
    const view = q.get("v") ? { [diagram]: q.get("v") } : {};
    return {
      diagram, view, file: q.get("f"), key: q.get("k"),
      line: Number(q.get("l")) || null, end: Number(q.get("e")) || null, fileView: q.get("fv") || "after",
    };
  }

  function record(push) {
    const p = place();
    const url = location.href.split("#")[0] + hashOf(p);
    if (push) {
      history.pushState(p, "", url);
    } else {
      history.replaceState(p, "", url);
    }
  }

  // navigate runs a step, and adds a history entry when the step changes the place.
  function navigate(step) {
    const before = hashOf(place());
    step();
    if (hashOf(place()) !== before) {
      record(true);
    }
  }

  function restore(p) {
    state.view = { ...p.view };
    selectDiagram(p.diagram);
    Object.assign(state, { file: p.file, key: p.key, line: p.line, end: p.end || null, fileView: p.fileView });
    if (state.file) {
      renderFile();
    } else {
      $("code-views").innerHTML = "";
      $("code-body").innerHTML = emptyCode;
      status(emptyStatus);
    }
  }

  // openHash opens the place that a URL hash names, and the top diagram for an empty one.
  function openHash(hash) {
    if (hash.startsWith("#code/")) {
      selectDiagram(0);
      showDecl(decodeURIComponent(hash.slice(6)), "after");
    } else {
      restore(hash.length > 1 ? placeOfHash(hash) : { diagram: 0, view: {}, file: null, key: null, line: null, end: null, fileView: "after" });
    }
  }

  if (data.diagrams.length) {
    openHash(location.hash);
    record(false);
  }
  // An entry without a state comes from a change of the hash alone, as in an edited URL.
  window.addEventListener("popstate", (e) => {
    if (e.state) {
      restore(e.state);
    } else {
      openHash(location.hash);
      record(false);
    }
  });

  // The splitter resizes the code panel, and this browser keeps the width.
  const main = document.querySelector("main");
  const splitter = $("splitter");
  const widthKey = "dfdreview.codeWidth";
  function setCodeWidth(px) {
    const width = Math.max(240, Math.min(px, main.clientWidth - 320));
    main.style.setProperty("--code-width", width + "px");
    return width;
  }
  function saveCodeWidth(width) {
    try {
      localStorage.setItem(widthKey, String(width));
    } catch (e) {
      // Without storage, the width lasts until the page reloads.
    }
  }
  try {
    const saved = Number(localStorage.getItem(widthKey));
    if (saved > 0) {
      setCodeWidth(saved);
    }
  } catch (e) {
    // Without storage, the panel keeps its default width.
  }
  splitter.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    splitter.setPointerCapture(e.pointerId);
    splitter.classList.add("dragging");
    document.body.classList.add("resizing");
  });
  splitter.addEventListener("pointermove", (e) => {
    if (splitter.hasPointerCapture(e.pointerId)) {
      setCodeWidth(main.getBoundingClientRect().right - e.clientX);
    }
  });
  splitter.addEventListener("pointerup", (e) => {
    splitter.releasePointerCapture(e.pointerId);
    splitter.classList.remove("dragging");
    document.body.classList.remove("resizing");
    saveCodeWidth($("code").offsetWidth);
  });
  splitter.addEventListener("keydown", (e) => {
    const step = e.shiftKey ? 80 : 20;
    if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
      e.preventDefault();
      const wider = e.key === "ArrowLeft" ? step : -step;
      saveCodeWidth(setCodeWidth($("code").offsetWidth + wider));
    }
  });
  splitter.addEventListener("dblclick", () => {
    main.style.removeProperty("--code-width");
    try {
      localStorage.removeItem(widthKey);
    } catch (e) {
      // Without storage, there is no saved width to forget.
    }
  });
  window.addEventListener("resize", () => {
    if (main.style.getPropertyValue("--code-width")) {
      setCodeWidth($("code").offsetWidth);
    }
  });
})();
</script>
</body>
</html>
