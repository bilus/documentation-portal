md/docportal/main.go","t":119},{"l":121,"c":15,"n":3,"f":"cmd/docportal/main.go","t":119},{"l":123,"c":9,"n":3,"f":"cmd/docportal/main.go","t":119},{"l":123,"c":13,"n":2,"u":"https://pkg.go.dev/os#Root.FS"},{"l":127,"c":6,"n":8,"f":"cmd/docportal/main.go","t":126,"e":130,"k":"main.setTryIt"},{"l":127,"c":20,"n":6,"f":"portal/docs.go","t":1},{"l":127,"c":27,"n":6,"f":"portal/portal.go","t":16,"k":"portal.Config"},{"l":127,"c":46,"n":6,"f":"portal/docs.go","t":1},{"l":127,"c":53,"n":6,"f":"portal/portal.go","t":16,"k":"portal.Config"},{"l":128,"c":2,"n":4,"f":"cmd/docportal/main.go","t":127},{"l":128,"c":7,"n":9,"f":"portal/portal.go","t":20},{"l":128,"c":19,"n":4,"f":"cmd/docportal/main.go","t":127},{"l":129,"c":9,"n":4,"f":"cmd/docportal/main.go","t":127}]},"cmd/docportal/main_test.go":{"before":"package main\n\nimport (\n\t\"io/fs\"\n\t\"net/http\"\n\t\"net/http/httptest\"\n\t\"os\"\n\t\"path/filepath\"\n\t\"strings\"\n\t\"testing\"\n)\n\nfunc noEnv(string) string { return \"\" }\n\nfunc get(h http.Handler, path string) *httptest.ResponseRecorder {\n\trec := httptest.NewRecorder()\n\th.ServeHTTP(rec, httptest.NewRequest(http.MethodGet, path, nil))\n\treturn rec\n}\n\nfunc TestStartupServesSpec(t *testing.T) {\n\taddr, h, err := startup([]string{\"-root-dir\", \"../../testdata/specs\", \"-spec-path\", \"petstore-3.0.yaml\"}, noEnv)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif addr != \":8080\" {\n\t\tt.Errorf(\"addr = %q, want :8080\", addr)\n\t}\n\n\tpage := get(h, \"/specs/petstore-3.0.yaml\")\n\tif page.Code != http.StatusOK || !strings.HasPrefix(page.Header().Get(\"Content-Type\"), \"text/html\") {\n\t\tt.Fatalf(\"viewer page: %d %s\", page.Code, page.Header().Get(\"Content-Type\"))\n\t}\n\tif want := `apiDescriptionUrl=\"/api/specs/petstore-3.0.yaml\"`; !strings.Contains(page.Body.String(), want) {\n\t\tt.Errorf(\"viewer page does not contain %s\", want)\n\t}\n\n\traw := get(h, \"/api/specs/petstore-3.0.yaml\")\n\twant, err := os.ReadFile(\"../../testdata/specs/petstore-3.0.yaml\")\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif raw.Code != http.StatusOK || !strings.HasPrefix(raw.Header().Get(\"Content-Type\"), \"application/yaml\") {\n\t\tt.Fatalf(\"raw spec: %d %s\", raw.Code, raw.Header().Get(\"Content-Type\"))\n\t}\n\tif raw.Body.String() != string(want) {\n\t\tt.Error(\"raw spec differs from the file\")\n\t}\n}\n\nfunc TestParseConfig(t *testing.T) {\n\tcfg, err := parseConfig(nil, noEnv)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif want := (config{Addr: \":8080\", RootDir: \".\", SpecPath: \"openapi.yaml\"}); cfg != want {\n\t\tt.Errorf(\"defaults = %+v, want %+v\", cfg, want)\n\t}\n\n\tenv := map[string]string{\"DOCPORTAL_ROOT_DIR\": \"/srv/docs\", \"DOCPORTAL_SPEC_PATH\": \"api.yaml\"}\n\tcfg, err = parseConfig([]string{\"-spec-path\", \"apis/pets.yaml\"}, func(k string) string { return env[k] })\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif want := (config{Addr: \":8080\", RootDir: \"/srv/docs\", SpecPath: \"apis/pets.yaml\"}); cfg != want {\n\t\tt.Errorf(\"got %+v, want %+v\", cfg, want)\n\t}\n\n\tif _, err := parseConfig([]string{\"-spec-path\", \"a.yaml\", \"b.yaml\"}, noEnv); err == nil {\n\t\tt.Error(\"a positional argument was accepted\")\n\t}\n}\n\nfunc TestParseConfigRejectsUnknownFlag(t *testing.T) {\n\t// -spec was the flag's name before it became -spec-path.\n\tif _, err := parseConfig([]string{\"-spec\", \"api.yaml\"}, noEnv); err == nil || !strings.Contains(err.Error(), \"-spec\") {\n\t\tt.Errorf(\"err = %v, want an error about -spec\", err)\n\t}\n}\n\nfunc TestParseConfigHelpListsFlags(t *testing.T) {\n\t_, err := parseConfig([]string{\"-h\"}, noEnv)\n\tif err == nil || !strings.Contains(err.Error(), \"-spec-path\") {\n\t\tt.Errorf(\"err = %v, want the usage with -spec-path\", err)\n\t}\n}\n\nfunc TestStartupRejectsMissingRootDir(t *testing.T) {\n\t_, _, err := startup([]string{\"-root-dir\", \"testdata/no-such-dir\"}, noEnv)\n\tif err == nil || !strings.Contains(err.Error(), \"testdata/no-such-dir\") {\n\t\tt.Errorf(\"err = %v, want it to name the directory\", err)\n\t}\n}\n\nfunc TestStartupRejectsSpecPathOutsideDir(t *testing.T) {\n\t_, _, err := startup([]string{\"-root-dir\", \"../../testdata/specs\", \"-spec-path\", \"../specs/petstore-3.0.yaml\"}, noEnv)\n\tif err == nil || !strings.Contains(err.Error(), \"../specs/petstore-3.0.yaml\") {\n\t\tt.Errorf(\"err = %v, want it to name the spec path\", err)\n\t}\n}\n\nfunc TestStartupServesDocs(t *testing.T) {\n\t_, h, err := startup([]string{\"-root-dir\", \"../../testdata\", \"-spec-path\", \"specs/petstore-3.0.yaml\", \"-docs-path\", \"docs\"}, noEnv)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\n\tlist := get(h, \"/docs/\")\n\tif list.Code != http.StatusOK || !strings.HasPrefix(list.Header().Get(\"Content-Type\"), \"text/html\") || !strings.Contains(list.Body.String(), `href=\"/docs/guide/intro.md\"`) {\n\t\tt.Errorf(\"document list: %d %s %q\", list.Code, list.Header().Get(\"Content-Type\"), list.Body)\n\t}\n\tpage := get(h, \"/docs/guide/intro.md\")\n\tif page.Code != http.StatusOK || !strings.HasPrefix(page.Header().Get(\"Content-Type\"), \"text/html\") || !strings.Contains(page.Body.String(), \"Introduction\") {\n\t\tt.Errorf(\"document page: %d %s %q\", page.Code, page.Header().Get(\"Content-Type\"), page.Body)\n\t}\n}\n\nfunc TestParseConfigReadsDocsPath(t *testing.T) {\n\tenv := func(k string) string { return map[string]string{\"DOCPORTAL_DOCS_PATH\": \"guides\"}[k] }\n\tif cfg, err := parseConfig(nil, env); err != nil || cfg.DocsPath != \"guides\" {\n\t\tt.Errorf(\"from the environment: %+v, %v\", cfg, err)\n\t}\n\tif cfg, err := parseConfig([]string{\"-docs-path\", \"docs\"}, env); err != nil || cfg.DocsPath != \"docs\" {\n\t\tt.Errorf(\"the flag over the environment: %+v, %v\", cfg, err)\n\t}\n}\n\nfunc TestStartupRejectsMissingDocsPath(t *testing.T) {\n\t_, _, err := startup([]string{\"-root-dir\", \"../../testdata/specs\", \"-spec-path\", \"petstore-3.0.yaml\", \"-docs-path\", \"no-such-docs\"}, noEnv)\n\tif err == nil || !strings.Contains(err.Error(), \"no-such-docs\") {\n\t\tt.Errorf(\"err = %v, want it to name the directory\", err)\n\t}\n}\n\n// writeEscape writes dir/secret.md, dir/root/docs/a.md and\n// dir/root/docs/escape.md, a symlink to the secret, and returns dir/root.\nfunc writeEscape(t *testing.T) string {\n\tt.Helper()\n\tdir := t.TempDir()\n\tdocs := filepath.Join(dir, \"root\", \"docs\")\n\tif err := os.MkdirAll(docs, 0o755); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tfor name, data := range map[string]string{\"secret.md\": \"# hunter2\\n\", \"root/docs/a.md\": \"# A\\n\"} {\n\t\tif err := os.WriteFile(filepath.Join(dir, name), []byte(data), 0o644); err != nil {\n\t\t\tt.Fatal(err)\n\t\t}\n\t}\n\tif err := os.Symlink(\"../../secret.md\", filepath.Join(docs, \"escape.md\")); err != nil {\n\t\tt.Fatal(err)\n\t}\n\treturn filepath.Join(dir, \"root\")\n}\n\nfunc TestOpenRootKeepsReadsInside(t *testing.T) {\n\tcfg, err := openRoot(writeEscape(t), \"api.yaml\", \"docs\")\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif cfg.SpecPath != \"api.yaml\" || cfg.DocsPath != \"docs\" {\n\t\tt.Errorf(\"SpecPath = %q, DocsPath = %q\", cfg.SpecPath, cfg.DocsPath)\n\t}\n\tif _, err := fs.ReadFile(cfg.Root, \"docs/a.md\"); err != nil {\n\t\tt.Errorf(\"docs/a.md: %v\", err)\n\t}\n\tif b, err := fs.ReadFile(cfg.Root, \"docs/escape.md\"); err == nil {\n\t\tt.Errorf(\"a symlink out of the directory was followed: %q\", b)\n\t}\n}\n\nfunc TestStartupKeepsDocsInside(t *testing.T) {\n\t_, h, err := startup([]string{\"-root-dir\", writeEscape(t), \"-spec-path\", \"api.yaml\", \"-docs-path\", \"docs\"}, noEnv)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif rec := get(h, \"/docs/escape.md\"); rec.Code != http.StatusNotFound || strings.Contains(rec.Body.String(), \"hunter2\") {\n\t\tt.Errorf(\"escape.md: %d %q\", rec.Code, rec.Body)\n\t}\n\tif list := get(h, \"/docs/\").Body.String(); strings.Contains(list, \"escape.md\") || !strings.Contains(list, `href=\"/docs/a.md\ le's document page.\n2. A link to the configured spec opens its viewer page, and a link to one of its operations in Stoplight's form, `\u003cspec path\u003e/paths/\u003cpath\u003e/\u003cmethod\u003e` with the path escaped as in a JSON pointer, opens the viewer page at that operation.\n3. A link with a leading `/`, such as `/docs/guide-oauth.md`, resolves against the documentation root too.\n4. Fragment links and absolute URLs stay as they are.\n5. A link that resolves outside the documentation root leads nowhere: the page shows its text without the link.\n6. The operator names the documentation root, and the spec path and the content directory path are relative to it (Q1).\n7. When no page serves the target of a relative link against the documentation root, and the link has no leading `/`, the target resolves against the markdown file's directory (Q2).\n8. A relative link leads nowhere when no page serves its target (Q3).\n\nOut of scope: images (#21), links inside raw HTML, links in the spec's own descriptions, rendered by Elements, and whether a fragment matches a heading ID that goldmark generates.\n\n## Questions and assumptions\n\n- Q1. The documentation root, the issue's first open question. Assumption: one new setting in place of two. `-root-dir` or `DOCPORTAL_ROOT_DIR` names the documentation root, `.` by default, and `-spec-path` and `-docs-path` (`DOCPORTAL_DOCS_PATH`) give the spec and the content directory as paths inside it. They replace `-specs-dir`, `DOCPORTAL_SPECS_DIR`, `-docs-dir` and `DOCPORTAL_DOCS_DIR`, and `portal.Config` takes one `Root` with `SpecPath` and `DocsPath` in place of `Specs` and `Docs`. The portal derives the content directory from the root, so no configuration can place it outside the root or name it twice. For conrad-api-docs: `-root-dir \u003cclone\u003e -spec-path CONRAD-Delivery-API.oas2.yml -docs-path docs`. For #4 the repository becomes the root, and #21 and #22 can read images and `toc.json` from it. Against: the flags change under the operator, with no alias for the old ones, since the operator is the only user. Keeping `-specs-dir` and `-docs-dir` and requiring the content directory inside the specs directory would keep the flags, but main would then compute the content directory's place from two local paths, where symlinks and letter case on macOS can defeat the comparison.\n- Q2. A fallback to the file's own directory, the issue's second open question. Assumption: yes. A relative link without a leading `/` resolves against the documentation root first, as on Stoplight. When no page serves that target, it resolves against the markdown file's directory, as on GitHub. The sample documents link that way (`guide/intro.md`, `../README.md`), and so do most markdown files written outside Stoplight. Against: a link that is broken on Stoplight works in the portal, so the portal does not show its author the break.\n- Q3. Targets inside the root that no page serves: a markdown file outside the content directory, an image, a directory, a missing file. Assumption: the link leads nowhere, where the browser shows a 404 today. A link to an image of the content directory could open its raw file, but the guides have none.\n- Q4. Other parts of the spec. Assumption: a link to `\u003cspec path\u003e/\u003cpointer\u003e` that names no operation of the published spec opens the viewer page at its start: a schema, a missing operation or an unpublished one. The route comes from the published spec, so a link to an unpublished operation reveals no operationId.\n- Q5. Routes. Elements 9.0.25 routes an operation to `#/operations/{operationId}`, and an operation without one to `#/paths/{slug}/{method}`. The slug replaces each `/`, `{`, `}` and space of the path with `-`, collapses the first run of dashes and trims a dash from each end. Checked in the viewer on the conrad spec: `#/operations/registerDevice` opens the operation behind `paths/~1devices/post`, `#/paths/apps-links-appLinkId/get` opens `GET /apps/links/{appLinkId}`, the one operation of 43 without an operationId, and an unknown route shows the overview. An upgrade of Elements can change the routes, so a browser test opens one.\n- Q6. Cost, measured at stage 2. Each link to an operation loads the published spec and parses it again to find the operation: a conrad guide with one such link takes 33 ms, where a guide without one takes 5 to 6 ms. A link to the spec itself costs nothing extra, and each relative link lists the markdown files once. Caching is out of scope.\n- Q7. Existing tests change at this gate, in their setup only: the flags and the environment in `cmd/docportal/main_test.go`, and the configuration in the e2e tests, `newPortal`, `newDocsPortal` and `TestCheckConfig`. `TestOpenSpecsKeepsReadsInside` and `TestOpenDocsKeepsReadsInside` merge into `TestOpenRootKeepsReadsInside`, since one function opens the root, and `TestStartupRejectsMissingDocsDir` expects its error from `portal.New`. No assertion about a page of the portal changes at this gate. Stage 1 changes one: `TestDocPage` expects `href=\"../README.md\"` on `guide/intro.md`, and the link becomes `href=\"/docs/README.md\"`, the same page, resolved by the portal instead of the browser. The sample `README.md` gains a Stoplight operation link for the browser test of stage 2.\n- Q8. Design. The portal rewrites the links per request, in the document page's handler, so the work belongs to box 3.3, as decided for #2 and #13. The top diagram changes: box 2 opens the documentation root and takes both paths, and box 4 goes, since no step opens the content directory any more. Box 3.1 also checks the content directory path.\n- Q9. Metaphor: none, as for #2, #13, #14 and #19.\n- Q10. Reviews: the design and vocabulary reviews run once, before the pull request.\n- Q11. Delivery: one pull request for the whole issue after the last stage's approval, with `Closes #20` at creation. It carries `10d0c37`, which adds git to devbox so that `gh` finds it.\n\n## The change in brief\n\nThe operator now names a documentation root that holds the configured spec and the content directory, and the spec path and the content directory path lie inside it. A document page points each relative link at the page that serves its target: the document page of a markdown file, the viewer page of the configured spec, or the viewer page at one of its operations when the link uses Stoplight's form. The portal resolves the target against the documentation root, as Stoplight does, and then against the markdown file's directory. A link leads nowhere when no page serves its target or when the target leaves the documentation root. Fragment links and absolute URLs stay as they are.\n\n## Stages\n\nEach stage ends with `devbox run make build lint test test-e2e`, the hole census (`grep -rn \"HOLE(\" --include='*.go' .`), the score card, the review page and a halt for review.\n\nThe plan gate changes the configuration inline: `-root-dir` and `-docs-path` in `main.parseConfig`, `main.openRoot` in place of `main.openSpecs` and `main.openDocs`, `portal.Config.Root` and `DocsPath`, the check of the content directory path in `portal.checkConfig`, and the content directory taken from the root in `portal.newRouter`, each with its tests. It declares the link functions as holes whose mock data leave every link as it is, as today, so every existing test stays green.\n\n### Stage 1: links to documents\n\n- Goal: a relative link opens the document page of its target, resolved against the documentation root and then against the file's directory, and a link whose target leaves the root or has no page leads nowhere.\n- Requirement: 1, 3, 4, 5, 7, 8.\n- Dependencies: none.\n- Holes: `1 portal.site.renderMarkdown`, `1 portal.site.linkURL`.\n- Acceptance: `TestDocLinks`.\n- Size: 150 lines.\n\n### Stage 2: links to the spec\n\n- Goal: a link to the configured spec opens its viewer page, and a link to one of its operations in Stoplight's form opens the viewer page at that operation.\n- Requirement: 2.\n- Dependencies: 1.\n- Holes: `2 portal.site.specURL`, `2 portal.operationRoute`.\n- Acceptance: `TestSpecLinks`, and `TestOperationLinkOpensOperation` in the browser.\n- Size: 130 lines.\n\n### Stage 3: the review's findings\n\n- Goal: no symlink leads out of the content directory again, each wrong implementation that passed the tests in the design review now fails one, and an unparsable link leads nowhere.\n- Requirement: 4, 5, 8, and the rule of #13 that no symlink leads out of the content directory.\n- Dependencies: 2.\n- Holes: none; each change starts as a failing test. Plan diff, approved by the user: box 3.1 in `docs/flow.3.dfd` opens the content directory through the documentation root, drawn beside it, and hands it to box 3.3; box 3 in `docs/flow.dfd` names its refusals. `portal.checkConfig` returns the content directory, `portal.newRouter` takes it, and `main.openRoot` returns a documentation root whose `Sub` opens a directory as an `os.Root` of its own.\n- Acceptance: `TestStartupKeepsDocsInside` with a symlink to a file inside the root but outside the content directory, `TestDocLinkWalk`, `TestDocLinkTargets`, `TestOperationRouteEdges`, `TestLinkURL`, and each of the design review's surviving wrong implementations failing at least one test. `TestLinkURL` now expects `%zz` to lead nowhere, as approved.\n- Size: 120 lines.\n","after":"# Resolve markdown links against the documentation root\n\nIssue: bilus/documentation-portal#20.\nLedger: `docs/plans/2026-09-30-root-links.ledger.md`.\nDesign: `docs/flow.dfd` and `docs/flow.3.dfd`, terms in `docs/vocabulary.md`, review page in `docs/review/index.html`.\nBranch: `bilus/development`, which tracks `origin/master`. Base: `10d0c37`.\n\n## Requirements\n\nRestated from the issue. The guides of `iBiquity/conrad-api-docs` were written for Stoplight, which resolves a relative link against the project root. They hold 6 links to guides, such as `docs/guide-oauth.md`, 4 links to the spec, 2 of them to an operation as `CONRAD-Delivery-API.oas2.yml/paths/~1devices/post`, and 1 link with a leading `/`.\n\n1. A relative link to a markdown file, written relative to the documentation root, opens the file's document page.\n2. A link to the configured spec opens its viewer page, and a link to one of its operations in Stoplight's form, `\u003cspec path\u003e/paths/\u003cpath\u003e/\u003cmethod\u003e` with the path escaped as in a JSON pointer, opens the viewer page at that operation.\n3. A link with a leading `/`, such as `/docs/guide-oauth.md`, resolves against the documentation root too.\n4. Fragment links and absolute URLs stay as they are.\n5. A link that resolves outside the documentation root leads nowhere: the page shows its text without the link.\n6. The operator names the documentation root, and the spec path and the content directory path are relative to it (Q1).\n7. When no page serves the target of a relative link against the documentation root, and the link has no leading `/`, the target resolves against the markdown file's directory (Q2).\n8. A relative link leads nowhere when no page serves its target (Q3).\n\nOut of scope: images (#21), links inside raw HTML, links in the spec's own descriptions, rendered by Elements, and whether a fragment matches a heading ID that goldmark generates.\n\n## Questions and assumptions\n\n- Q1. The documentation root, the issue's first open question. Assumption: one new setting in place of two. `-root-dir` or `DOCPORTAL_ROOT_DIR` names the documentation root, `.` by default, and `-spec-path` and `-docs-path` (`DOCPORTAL_DOCS_PATH`) give the spec and the content directory as paths inside it. They replace `-specs-dir`, `DOCPORTAL_SPECS_DIR`, `-docs-dir` and `DOCPORTAL_DOCS_DIR`, and `portal.Config` takes one `Root` with `SpecPath` and `DocsPath` in place of `Specs` and `Docs`. The portal derives the content directory from the root, so no configuration can place it outside the root or name it twice. For conrad-api- ationId}`, and an operation without one to `#/paths/{slug}/{method}`. The slug replaces each `/`, `{`, `}` and space of the path with `-`, collapses the first run of dashes and trims a dash from each end. Checked in the viewer on the conrad spec: `#/operations/registerDevice` opens the operation behind `paths/~1devices/post`, `#/paths/apps-links-appLinkId/get` opens `GET /apps/links/{appLinkId}`, the one operation of 43 without an operationId, and an unknown route shows the overview. An upgrade of Elements can change the routes, so a browser test opens one. An operationId that needs escaping in a URL, such as one with a space, a non-ASCII letter or a `#`, opens the overview: the design review found that Elements 9.0.25 does not route it either, even from its own sidebar on a fresh load.\n- Q6. Cost, measured at stage 2. Each link to an operation loads the published spec and parses it again to find the operation: a conrad guide with one such link takes 33 ms, where a guide without one takes 5 to 6 ms. A link to the spec itself costs nothing extra, and each relative link lists the markdown files once. Caching is out of scope.\n- Q7. Existing tests change at this gate, in their setup only: the flags and the environment in `cmd/docportal/main_test.go`, and the configuration in the e2e tests, `newPortal`, `newDocsPortal` and `TestCheckConfig`. `TestOpenSpecsKeepsReadsInside` and `TestOpenDocsKeepsReadsInside` merge into `TestOpenRootKeepsReadsInside`, since one function opens the root, and `TestStartupRejectsMissingDocsDir` expects its error from `portal.New`. No assertion about a page of the portal changes at this gate. Stage 1 changes one: `TestDocPage` expects `href=\"../README.md\"` on `guide/intro.md`, and the link becomes `href=\"/docs/README.md\"`, the same page, resolved by the portal instead of the browser. The sample `README.md` gains a Stoplight operation link for the browser test of stage 2.\n- Q8. Design. The portal rewrites the links per request, in the document page's handler, so the work belongs to box 3.3, as decided for #2 and #13. The top diagram changes: box 2 opens the documentation root and takes both paths, and box 4 goes, since no step opens the content directory any more. Box 3.1 also checks the content directory path.\n- Q9. Metaphor: none, as for #2, #13, #14 and #19.\n- Q10. Reviews: the design and vocabulary reviews run once, before the pull request.\n- Q11. Delivery: one pull request for the whole issue after the last stage's approval, with `Closes #20` at creation. It carries `10d0c37`, which adds git to devbox so that `gh` finds it.\n\n## The change in brief\n\nThe operator now names a documentation root that holds the configured spec and the content directory, and the spec path and the content directory path lie inside it. A document page points each relative link at the page that serves its target: the document page of a markdown file, the viewer page of the configured spec, or the viewer page at one of its operations when the link uses Stoplight's form. The portal resolves the target against the documentation root, as Stoplight does, and then against the markdown file's directory. A link leads nowhere when no page serves its target or when the target leaves the documentation root. Fragment links and absolute URLs stay as they are.\n\n## Stages\n\nEach stage ends with `devbox run make build lint test test-e2e`, the hole census (`grep -rn \"HOLE(\" --include='*.go' .`), the score card, the review page and a halt for review.\n\nThe plan gate changes the configuration inline: `-root-dir` and `-docs-path` in `main.parseConfig`, `main.openRoot` in place of `main.openSpecs` and `main.openDocs`, `portal.Config.Root` and `DocsPath`, the check of the content directory path in `portal.checkConfig`, and the content directory taken from the root in `portal.newRouter`, each with its tests. It declares the link functions as holes whose mock data leave every link as it is, as today, so every existing test stays green.\n\n### Stage 1: links to documents\n\n- Goal: a relative link opens the document page of its target, resolved against the documentation root and then against the file's directory, and a link whose target leaves the root or has no page leads nowhere.\n- Requirement: 1, 3, 4, 5, 7, 8.\n- Dependencies: none.\n- Holes: `1 portal.site.renderMarkdown`, `1 portal.site.linkURL`.\n- Acceptance: `TestDocLinks`.\n- Size: 150 lines.\n\n### Stage 2: links to the spec\n\n- Goal: a link to the configured spec opens its viewer page, and a link to one of its operations in Stoplight's form opens the viewer page at that operation.\n- Requirement: 2.\n- Dependencies: 1.\n- Holes: `2 portal.site.specURL`, `2 portal.operationRoute`.\n- Acceptance: `TestSpecLinks`, and `TestOperationLinkOpensOperation` in the browser.\n- Size: 130 lines.\n\n### Stage 3: the review's findings\n\n- Goal: no symlink leads out of the content directory again, each wrong implementation that passed the tests in the design review now fails one, and an unparsable link leads nowhere.\n- Requirement: 4, 5, 8, and the rule of #13 that no symlink leads out of the content directory.\n- Dependencies: 2.\n- Holes: none; each change starts as a failing test. Plan diff, approved by the user: box 3.1 in `docs/flow.3.dfd` opens the content directory through the documentation root, drawn beside it, and hands it to box 3.3; box 3 in `docs/flow.dfd` names its refusals. `portal.checkConfig` returns the content directory, `portal.newRouter` takes it, and `main.openRoot` returns a documentation root whose `Sub` opens a directory as an `os.Root` of its own.\n- Acceptance: `TestStartupKeepsDocsInside` with a symlink to a file inside the root but outside the content directory, `TestDocLinkWalk`, `TestDocLinkTargets`, `TestOperationRouteEdges`, `TestLinkURL`, and each of the design review's surviving wrong implementations failing at least one test. `TestLinkURL` now expects `%zz` to lead nowhere, as approved.\n- Size: 120 lines. ORTAL_ROOT_DIR, DOCPORTAL_SPEC_PATH, DOCPORTAL_DOCS_PATH and DOCPORTAL_HIDE_TRY_IT. Tests pass their own lookup.\n- configuration: the address, the documentation root name, the spec path, the content directory path and the Try It setting, each taken from its flag, else from the environment, else from its default: :8080, ., openapi.yaml, empty and false.\n- startup: reading the configuration, opening the documentation root, adding the Try It setting to the portal configuration, and building the portal, in main.startup. A failure there stops docportal before it listens.\n- address: the network address docportal listens on, such as :8080.\n- documentation root: the local directory that holds the configured spec and the content directory. The portal resolves the links of the markdown files against it, as Stoplight resolves them against its project root.\n- documentation root name: the documentation root's path on the local file system, as the operator gives it.\n- documentation root handle: the documentation root opened with os.OpenRoot, as an fs.FS. Every read of the spec, a markdown file or an image goes through it, and os.OpenRoot keeps each read inside the root, symlinks included.\n- spec path: the path, relative to the documentation root, of the API spec to serve.\n- configured spec: the file at the spec path. Under /specs/ and /api/specs/, the portal serves no other file of the documentation root.\n- missing spec: a request under /specs/ or /api/specs/ that names no configured spec: a path other than the spec path, or a spec path with no file behind it. It gets a 404 that names the path.\n- invalid spec: a configured spec that is not an API spec: not YAML, not OpenAPI 3.0 or 3.1, or without a title. It gets an error page naming the file and the reason, and /api/specs/{spec path} answers with an error naming the file and the reason, both with status 422.\n- error page: the HTML page the portal shows instead of the viewer page for an invalid or missing spec, and instead of a document page for a path that names no markdown file, or a hidden one.\n- content directory: the directory at the content directory path, which holds the markdown files and their images. docportal runs without one.\n- content directory path: the content directory's path inside the documentation root, from -docs-path or DOCPORTAL_DOCS_PATH, or empty without a content directory.\n- markdown file: a file of the content directory named *.md or *.markdown.\n- image: a file of the content directory named *.png, *.jpg, *.jpeg, *.gif, *.webp or *.svg.\n- hidden: of a file or directory of the content directory, with a name that starts with a dot. The portal lists and serves nothing hidden and nothing inside a hidden directory.\n- path: in /docs/{path} and /raw/{path}, a slash-separated path relative to the content directory.\n- sample documents: testdata/docs, the fixture directory of the markdown file and raw file tests.\n- portal configuration: the documentation root handle, the spec path, the content directory path and the Try It setting, as portal.New takes them. Tests pass any fs.FS in the handle's place.\n- portal: the HTTP handler that redirects / to the viewer page and serves the viewer page, the raw spec and the Elements assets, and with a content directory the document list, the document pages and the raw files.\n- router: the http.ServeMux that newRouter builds and portal.New returns as the portal. It sends each request to its handler by method and path.\n- HTTP server: net/http's server, which listens on the address and calls the portal for each request.\n- viewer page: the HTML page at /specs/{spec path} that embeds Stoplight Elements pointed at the raw spec, with the Try It console unless the Try It setting hides it.\n- Try It console: the part of the viewer page where Stoplight Elements sends requests from the reader's browser to the servers listed in the raw spec.\n- Try It setting: whether the viewer page hides the Try It console. It is true with -hide-try-it or a true DOCPORTAL_HIDE_TRY_IT, and false by default.\n- document list: the HTML page at /docs/ that links the document page of every markdown file that is not hidden, each titled with its path, in byte order of the paths.\n- document page: the HTML page at /docs/{path} that shows one markdown file rendered as HTML without active content, with each relative link pointed at the page that serves its link target.\n- relative link: a link of a markdown file whose destination has a path but no scheme and no host, such as docs/guide-oauth.md or /docs/guide-oauth.md.\n- link target: the path inside the documentation root named by a relative link: its path against the documentation root or, when no page serves that and the path has no leading /, its path against the markdown file's directory.\n- Stoplight operation link: a relative link to \u003cspec path\u003e/paths/\u003cpath\u003e/\u003cmethod\u003e, with the path escaped as in a JSON pointer, as Stoplight writes a link to an operation, such as CONRAD-Delivery-API.oas2.yml/paths/~1devices/post.\n- operation route: the part of a viewer page URL after the #, which opens one operation: /operations/{operationId}, or /paths/{slug}/{method} for an operation without an operationId.\n- leads nowhere: of a link, shown as its text alone, without the link.\n- document sidebar: the column at the left of the document list and the document pages that links the document page of every markdown file that is not hidden, grouped by directory, with the markup and the classes of the sidebar that Stoplight Elements draws on the viewer page.\n- active content: markup that runs in the reader's browser, such as a \u003cscript\u003e element or a javascript: link.\n- navigation bar: the links at the top of every HTML page of the portal: to the viewer page, and to the document list when a content directory is configured.\n- raw spec: the response at /api/specs/{spec path}, as application/yaml: the configured spec without its unpublished parts and marker keys. A configured spec from which the rules remove nothing comes back byte for byte. Any other spec is written again from its parsed form, with every YAML document and the order of its keys, but not its layout.\n- unpublished part: a part of the configured spec that a marker key marks for the publication target main: a key whose value is a mapping with an x-doNotPublish value that names main, together with that mapping; a list element that is such a mapping; or the sibling \u003cname\u003e of a key x-doNotPublish-\u003cname\u003e whose value names main. A value names main when it is the scalar main or a list that holds main. The root mapping is never an unpublished part, and an alias counts as a copy of its anchor's node.\n- marker key: an x-doNotPublish key or a key x-doNotPublish-\u003cname\u003e. Its value names one or more publication targets.\n- publication target: a name in the value of a marker key, such as main or beta, for one publication of the documentation. The portal publishes for main alone.\n- raw file: the response at /raw/{path}: an image that is not hidden, unchanged, with the image type of its extension, X-Content-Type-Options: nosniff, so that the browser reads it as that type only, and Content-Security-Policy: sandbox, so that no script in it runs.\n- Stoplight Elements: the web component that renders an API spec as documentation in the reader's browser.\n- Elements assets: the Stoplight Elements script, stylesheet and license, downloaded by `make setup` and embedded in docportal.\n","after":"# Vocabulary\n\nTerms of docportal, one per line.\n\n- docportal: the program built from cmd/docportal.\n- API spec: an OpenAPI 3.0 or 3.1 document in YAML with a non-empty info.title, usually a bundle.\n- bundle: an API spec whose $refs all point inside its own file, such as #/components/schemas/Pet.\n- sample bundle: testdata/specs/petstore-3.0.yaml or testdata/specs/petstore-3.1.yaml, the bundles the tests render.\n- operation: one me spec path, or a spec path with no file behind it. It gets a 404 that names the path.\n- invalid spec: a configured spec that is not an API spec: not YAML, not OpenAPI 3.0 or 3.1, or without a title. It gets an error page naming the file and the reason, and /api/specs/{spec path} answers with an error naming the file and the reason, both with status 422.\n- error page: the HTML page the portal shows instead of the viewer page for an invalid or missing spec, and instead of a document page for a path that names no markdown file, or a hidden one.\n- content directory: the directory at the content directory path, which holds the markdown files and their images. docportal runs without one.\n- content directory path: the content directory's path inside the documentation root, from -docs-path or DOCPORTAL_DOCS_PATH, or empty without a content directory.\n- content directory handle: the content directory as an fs.FS, which portal.New opens through the documentation root handle. With the handle from startup, it is an os.Root of its own, so no symlink leads out of the content directory.\n- markdown file: a file of the content directory named *.md or *.markdown.\n- image: a file of the content directory named *.png, *.jpg, *.jpeg, *.gif, *.webp or *.svg.\n- hidden: of a file or directory of the content directory, with a name that starts with a dot. The portal lists and serves nothing hidden and nothing inside a hidden directory.\n- path: in /docs/{path} and /raw/{path}, a slash-separated path relative to the content directory.\n- sample documents: testdata/docs, the fixture directory of the markdown file and raw file tests.\n- portal configuration: the documentation root handle, the spec path, the content directory path and the Try It setting, as portal.New takes them. Tests pass any fs.FS in the handle's place.\n- portal: the HTTP handler that redirects / to the viewer page and serves the viewer page, the raw spec and the Elements assets, and with a content directory the document list, the document pages and the raw files.\n- router: the http.ServeMux that newRouter builds and portal.New returns as the portal. It sends each request to its handler by method and path.\n- HTTP server: net/http's server, which listens on the address and calls the portal for each request.\n- viewer page: the HTML page at /specs/{spec path} that embeds Stoplight Elements pointed at the raw spec, with the Try It console unless the Try It setting hides it.\n- Try It console: the part of the viewer page where Stoplight Elements sends requests from the reader's browser to the servers listed in the raw spec.\n- Try It setting: whether the viewer page hides the Try It console. It is true with -hide-try-it or a true DOCPORTAL_HIDE_TRY_IT, and false by default.\n- document list: the HTML page at /docs/ that links the document page of every markdown file that is not hidden, each titled with its path, in byte order of the paths.\n- document page: the HTML page at /docs/{path} that shows one markdown file rendered as HTML without active content, with each relative link pointed at the page that serves its link target, or shown as text when the link leads nowhere.\n- relative link: a markdown link, inline or by reference, whose destination has a path but no scheme and no host, such as docs/guide-oauth.md or /docs/guide-oauth.md. An \u003ca\u003e element in raw HTML is not one.\n- link target: the path named by a relative link, taken against the documentation root or, when no page serves that and the link has no leading /, against the markdown file's directory. It may leave the documentation root. A document page serves the link target of a markdown file of the content directory, and the viewer page serves the configured spec and its parts.\n- Stoplight: a hosted documentation platform, the target of the guides in conrad-api-docs. It resolves a relative link against its project root, the top directory of the repository.\n- Stoplight operation link: a relative link to \u003cspec path\u003e/paths/\u003cpath\u003e/\u003cmethod\u003e, with the path escaped as in a JSON pointer, as Stoplight writes a link to an operation, such as CONRAD-Delivery-API.oas2.yml/paths/~1devices/post. The part after \u003cspec path\u003e/ is its pointer: a JSON pointer into the spec without its leading /.\n- operation route: the part of a viewer page URL after the #, which opens one operation: /operations/{operationId}, or /paths/{slug}/{method} for an operation without an operationId. The slug is the operation's path with each /, {, } and space turned into -, the first run of dashes collapsed to one and a dash trimmed from each end, as Stoplight Elements makes it.\n- leads nowhere: of a relative link, shown as its text alone, without the link, because no page serves its link target, the target leaves the documentation root, or the destination does not parse.\n- document sidebar: the column at the left of the document list and the document pages that links the document page of every markdown file that is not hidden, grouped by directory, with the markup and the classes of the sidebar that Stoplight Elements draws on the viewer page.\n- active content: markup that runs in the reader's browser, such as a \u003cscript\u003e element or a javascript: link.\n- navigation bar: the links at the top of every HTML page of the portal: to the viewer page, and to the document list when a content directory is configured.\n- published spec: the configured spec without its unpublished parts and marker keys. The raw spec carries it, and the viewer page's title and the operation routes come from it.\n- raw spec: the response at /api/specs/{spec path}, as application/yaml: the configured spec without its unpublished parts and marker keys. A configured spec from which the rules remove nothing comes back byte for byte. Any other spec is written again from its parsed form, with every YAML document and the order of its keys, but not its layout.\n- unpublished part: a part of the conf != http.StatusOK || !strings.HasPrefix(rec.Header().Get(\"Content-Type\"), \"text/html\") {\n\t\tt.Fatalf(\"got %d %s\", rec.Code, rec.Header().Get(\"Content-Type\"))\n\t}\n\tbody := rec.Body.String()\n\tlist := body[max(strings.Index(body, \"\u003cul\u003e\"), 0):]\n\tvar at []int\n\tfor _, doc := range []string{\"README.md\", \"guide/intro.md\", \"unsafe.md\"} {\n\t\ti := strings.Index(list, `href=\"/docs/`+doc+`\"`)\n\t\tif i \u003c 0 {\n\t\t\tt.Errorf(\"the list does not link %s\", doc)\n\t\t}\n\t\tat = append(at, i)\n\t}\n\tif !sort.IntsAreSorted(at) {\n\t\tt.Errorf(\"the list is not sorted by path: links at %v\", at)\n\t}\n\tfor _, name := range []string{\".hidden.md\", \"draft.md\", \"notes.txt\", \"page.html\", \"evil.svg\", \"diagram.png\"} {\n\t\tif strings.Contains(body, name) {\n\t\t\tt.Errorf(\"the list shows %s\", name)\n\t\t}\n\t}\n}\n\nfunc TestDocPage(t *testing.T) {\n\trec := get(newDocsPortal(t, sampleDocs), \"/docs/guide/intro.md\")\n\tif rec.Code != http.StatusOK || !strings.HasPrefix(rec.Header().Get(\"Content-Type\"), \"text/html\") {\n\t\tt.Fatalf(\"got %d %s\", rec.Code, rec.Header().Get(\"Content-Type\"))\n\t}\n\tfor _, want := range []string{\n\t\t\"\u003ch1\",\n\t\t\"Introduction\u003c/h1\u003e\",\n\t\t\"\u003cem\u003emarkdown\u003c/em\u003e\",\n\t\t\"\u003cli\u003eone\u003c/li\u003e\",\n\t\t\"\u003cpre\u003e\u003ccode\",\n\t\t`href=\"/docs/README.md\"`,\n\t\t`src=\"/raw/guide/diagram.png\"`,\n\t} {\n\t\tif !strings.Contains(rec.Body.String(), want) {\n\t\t\tt.Errorf(\"the page does not contain %s\", want)\n\t\t}\n\t}\n}\n\nfunc TestDocPageDropsActiveContent(t *testing.T) {\n\trec := get(newDocsPortal(t, sampleDocs), \"/docs/unsafe.md\")\n\tbody := rec.Body.String()\n\tif rec.Code != http.StatusOK || !strings.Contains(body, \"Click me\") {\n\t\tt.Fatalf(\"got %d %q\", rec.Code, body)\n\t}\n\tfor _, bad := range []string{\"\u003cscript\", \"javascript:\"} {\n\t\tif strings.Contains(body, bad) {\n\t\t\tt.Errorf(\"the page contains %s\", bad and embedded in docportal.","HTTP server":"net/http's server, which listens on the address and calls the portal for each request.","Stoplight Elements":"the web component that renders an API spec as documentation in the reader's browser.","Stoplight operation link":"a relative link to \u003cspec path\u003e/paths/\u003cpath\u003e/\u003cmethod\u003e, with the path escaped as in a JSON pointer, as Stoplight writes a link to an operation, such as CONRAD-Delivery-API.oas2.yml/paths/~1devices/post.","Try It console":"the part of the viewer page where Stoplight Elements sends requests from the reader's browser to the servers listed in the raw spec.","Try It setting":"whether the viewer page hides the Try It console. It is true with -hide-try-it or a true DOCPORTAL_HIDE_TRY_IT, and false by default.","active content":"markup that runs in the reader's browser, such as a \u003cscript\u003e element or a javascript: link.","address":"the network address docportal listens on, such as :8080.","arguments":"docportal's command-line arguments, without the program name: the flags and nothing else.","bundle":"an API spec whose $refs all point inside its own file, such as #/components/schemas/Pet.","configuration":"the address, the documentation root name, the spec path, the content directory path and the Try It setting, each taken from its flag, else from the environment, else from its default: :8080, ., openapi.yaml, empty and false.","configured spec":"the file at the spec path. Under /specs/ and /api/specs/, the portal serves no other file of the documentation root.","content directory":"the directory at the content directory path, which holds the markdown files and their images. docportal runs without one.","content directory path":"the content directory's path inside the documentation root, from -docs-path or DOCPORTAL_DOCS_PATH, or empty without a content directory.","docportal":"the program built from cmd/docportal.","document list":"the HTML page at /docs/ that links the document page of every markdown file that is not hidden, each titled with its path, in byte order of the paths.","document page":"the HTML page at /docs/{path} that shows one markdown file rendered as HTML without active content, with each relative link pointed at the page that serves its link target.","document sidebar":"the column at the left of the document list and the document pages that links the document page of every markdown file that is not hidden, grouped by directory, with the markup and the classes of the sidebar that Stoplight Elements draws on the viewer page.","documentation root":"the local directory that holds the configured spec and the content directory. The portal resolves the links of the markdown files against it, as Stoplight resolves them against its project root.","documentation root handle":"the documentation root opened with os.OpenRoot, as an fs.FS. Every read of the spec, a markdown file or an image goes through it, and os.OpenRoot keeps each read inside the root, symlinks included.","documentation root name":"the documentation root's path on the local file system, as the operator gives it.","environment":"a lookup of environment variables, of which docportal reads DOCPORTAL_ADDR, DOCPORTAL_ROOT_DIR, DOCPORTAL_SPEC_PATH, DOCPORTAL_DOCS_PATH and DOCPORTAL_HIDE_TRY_IT. Tests pass their own lookup.","error page":"the HTML page the portal shows instead of the viewer page for an invalid or missing spec, and instead of a document page for a path that names no markdown file, or a hidden one.","flags":"-addr, -root-dir, -spec-path, -docs-path and -hide-try-it. Any other flag is rejected.","hidden":"of a file or directory of the content directory, with a name that starts with a dot. The portal lists and serves nothing hidden and nothing inside a hidden directory.","image":"a file of the content directory named *.png, *.jpg, *.jpeg, *.gif, *.webp or *.svg.","invalid spec":"a configured spec that is not an API spec: not YAML, not OpenAPI 3.0 or 3.1, or n the value of a marker key, such as main or beta, for one publication of the documentation. The portal publishes for main alone.","raw file":"the response at /raw/{path}: an image that is not hidden, unchanged, with the image type of its extension, X-Content-Type-Options: nosniff, so that the browser reads it as that type only, and Content-Security-Policy: sandbox, so that no script in it runs.","raw spec":"the response at /api/specs/{spec path}, as application/yaml: the configured spec without its unpublished parts and marker keys. A configured spec from which the rules remove nothing comes back byte for byte. Any other spec is written again from its parsed form, with every YAML document and the order of its keys, but not its layout.","reader":"the person who reads the documentation in a browser.","relative link":"a link of a markdown file whose destination has a path but no scheme and no host, such as docs/guide-oauth.md or /docs/guide-oauth.md.","router":"the http.ServeMux that newRouter builds and portal.New returns as the portal. It sends each request to its handler by method and path.","sample bundle":"testdata/specs/petstore-3.0.yaml or testdata/specs/petstore-3.1.yaml, the bundles the tests render.","sample documents":"testdata/docs, the fixture directory of the markdown file and raw file tests.","spec path":"the path, relative to the documentation root, of the API spec to serve.","startup":"reading the configuration, opening the documentation root, adding the Try It setting to the portal configuration, and building the portal, in main.startup. A failure there stops docportal before it listens.","unpublished part":"a part of the configured spec that a marker key marks for the publication target main: a key whose value is a mapping with an x-doNotPublish value that names main, together with that mapping; a list element that is such a mapping; or the sibling \u003cname\u003e of a key x-doNotPublish-\u003cname\u003e whose value names main. A value names main w
