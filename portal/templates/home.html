<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
<style>body { font-family: system-ui, sans-serif; margin: 0; } main { max-width: 40rem; margin: 3rem auto; padding: 0 1rem; }</style>
</head>
<body>
{{template "banner" .}}{{if .Nav.Account}}{{template "nav" .}}
{{end}}<main>
<h1>{{.Title}}</h1>
{{with .Portals}}<ul>
{{range .}}<li><a href="{{.URL}}">{{.Label}}</a></li>
{{end}}</ul>{{else}}<p>{{.Message}}</p>{{end}}
</main>
</body>
</html>
