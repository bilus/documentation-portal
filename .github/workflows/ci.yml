# The gate without the browser tests and without the chat: build, lint (with
# the dependency check of the core packages) and the unit tests, through
# devbox as the Makefile expects. TAGS= leaves out the build tag chat, and
# with it package chat and its private module github.com/bilus/live-templ, so
# the job needs no token. The chat's own tests run locally, with the tag.
name: ci
on:
  push:
    branches: [master]
  pull_request:
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jetify-com/devbox-install-action@v0.13.0
        with:
          enable-cache: true
      - run: devbox run make build lint test TAGS=
